  macos_ui_validation:
    if: ${{ inputs.suite == 'personal-mac-ui' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[mac]')) }}
    name: ${{ inputs.suite || 'personal-preflight' }} (${{ inputs.phase || (contains(github.event.head_commit.message, '[green]') && 'green' || 'red') }})
    runs-on: macos-26-intel
    timeout-minutes: 90
    steps:
      - name: Validate immutable public-repository dispatch
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          EVENT_SHA: ${{ github.sha }}
          CURRENT_REPOSITORY: ${{ github.repository }}
          REPOSITORY_IS_PRIVATE: ${{ github.event.repository.private }}
          CURRENT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$CURRENT_REPOSITORY" != "$PERSONAL_RELEASE_REPOSITORY" ]]; then
            echo "::error::This workflow is restricted to $PERSONAL_RELEASE_REPOSITORY."
            exit 1
          fi
          if [[ "$REPOSITORY_IS_PRIVATE" != "false" ]]; then
            echo "::error::The personal build must use a public repository and standard free runners."
            exit 1
          fi
          if [[ "$CURRENT_REF" != "refs/heads/agent/openclaw-beta-5-1" ]]; then
            echo "::error::Dispatch the one existing personal repair branch."
            exit 1
          fi
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::source_sha must be a full lowercase Git SHA."
            exit 1
          fi
          if [[ "$EVENT_SHA" != "$SOURCE_SHA" ]]; then
            echo "::error::The dispatched ref resolved to $EVENT_SHA, expected $SOURCE_SHA."
            exit 1
          fi

      - name: Checkout exact source SHA
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 200
          persist-credentials: false

      - name: Verify frozen official ancestry and Xcode
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "$SOURCE_SHA" ]]; then
            echo "::error::Checkout did not resolve to the requested source SHA."
            exit 1
          fi
          official_remote="official-openclaw"
          official_url="https://github.com/openclaw/openclaw.git"
          git remote add "$official_remote" "$official_url"
          git fetch --no-tags --filter=blob:none "$official_remote" \
            "$FROZEN_UPSTREAM_SHA" "$FROZEN_BETA7_SHA"
          if ! git merge-base --is-ancestor "$FROZEN_UPSTREAM_SHA" "$SOURCE_SHA"; then
            echo "::error::Source does not contain frozen official main $FROZEN_UPSTREAM_SHA."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$FROZEN_BETA7_SHA" "$SOURCE_SHA"; then
            echo "::error::Source does not contain official beta.7 $FROZEN_BETA7_SHA."
            exit 1
          fi
          xcodebuild -version
          xcode_version="$(xcodebuild -version | awk 'NR == 1 { print $2 }')"
          if [[ "$xcode_version" != 26.* ]]; then
            echo "::error::Expected Xcode 26.x, got $xcode_version."
            exit 1
          fi
          swift --version

      - name: Run macOS and shared UI regression suites
        run: |
          set -euo pipefail
          macos_status=0
          swift test             --package-path apps/macos             --filter 'DashboardWindowSmokeTests|WebChatSwiftUISmokeTests|CLIInstallerTests|MacNodeModeCoordinatorTests'             --no-parallel || macos_status=$?
          shared_status=0
          swift test             --package-path apps/shared/OpenClawKit             --filter 'ChatSessionSidebarModelTests|ChatViewModelSessionDeletionTests'             --no-parallel || shared_status=$?
          if (( macos_status != 0 || shared_status != 0 )); then
            echo "::error::macOS suite status=$macos_status shared UI suite status=$shared_status"
            exit 1
          fi

  macos_package:
    if: ${{ inputs.suite == 'personal-macos-package' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[package]')) }}
    needs: focused_validation
    permissions:
      contents: read
    name: Build OpenClaw 2026.8.1 Self-Built Beta 1 universal App and Intel staging
    runs-on: macos-26-intel
    timeout-minutes: 240
    outputs:
      artifact_name: ${{ steps.release_meta.outputs.artifact_name }}
      build_timestamp: ${{ steps.release_meta.outputs.build_timestamp }}
      staging_cache_key: ${{ steps.release_meta.outputs.staging_cache_key }}
      raw_package_name: ${{ steps.source_package.outputs.raw_package_name }}
      codex_package_name: ${{ steps.codex_package.outputs.codex_package_name }}
    env:
      SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
      GIT_COMMIT: ${{ inputs.source_sha || github.sha }}
      APP_VERSION: "2026.8.1-selfbuild.1"
      APP_DISPLAY_NAME: "OpenClaw 2026.8.1 Self-Built Beta 1"
      APP_BUNDLE_SHORT_VERSION: "2026.8.1"
      APP_BUILD: "2608000189"
      BUNDLE_ID: "ai.openclaw.mac"
      NODE_OPTIONS: "--max-old-space-size=6144"
      PNPM_CONFIG_CHILD_CONCURRENCY: "2"
      PNPM_CONFIG_NETWORK_CONCURRENCY: "8"
      OPENCLAW_CONTROL_UI_RELEASE_BUILD: "1"

    steps:
      - name: Validate immutable public-repository build dispatch
        env:
          EVENT_SHA: ${{ github.sha }}
          CURRENT_REPOSITORY: ${{ github.repository }}
          REPOSITORY_IS_PRIVATE: ${{ github.event.repository.private }}
          CURRENT_REF: ${{ github.ref }}
          TDD_PHASE: ${{ inputs.phase || (contains(github.event.head_commit.message, '[package]') && 'green' || 'red') }}
        run: |
          set -euo pipefail
          if [[ "$CURRENT_REPOSITORY" != "$PERSONAL_RELEASE_REPOSITORY" ]]; then
            echo "::error::This workflow is restricted to $PERSONAL_RELEASE_REPOSITORY."
            exit 1
          fi
          if [[ "$REPOSITORY_IS_PRIVATE" != "false" ]]; then
            echo "::error::The personal build must use a public repository and standard free runners."
            exit 1
          fi
          if [[ "$CURRENT_REF" != "refs/heads/agent/openclaw-beta-5-1" ]]; then
            echo "::error::Dispatch the one existing personal repair branch."
            exit 1
          fi
          if [[ "$TDD_PHASE" != "red" && "$TDD_PHASE" != "green" ]]; then
            echo "::error::macOS packaging accepts only RED or GREEN validation phases."
            exit 1
          fi
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::source_sha must be a full lowercase Git SHA."
            exit 1
          fi
          if [[ "$EVENT_SHA" != "$SOURCE_SHA" ]]; then
            echo "::error::The dispatched ref resolved to $EVENT_SHA, expected $SOURCE_SHA."
            exit 1
          fi

      - name: Checkout exact frozen source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 200
          persist-credentials: false

      - name: Verify frozen official ancestry
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "$SOURCE_SHA" ]]; then
            echo "::error::Checkout did not resolve to $SOURCE_SHA."
            exit 1
          fi
          official_remote="official-openclaw"
          official_url="https://github.com/openclaw/openclaw.git"
          if git remote get-url "$official_remote" >/dev/null 2>&1; then
            git remote set-url "$official_remote" "$official_url"
          else
            git remote add "$official_remote" "$official_url"
          fi
          git fetch --no-tags --filter=blob:none "$official_remote" \
            "$FROZEN_UPSTREAM_SHA" "$FROZEN_BETA7_SHA"
          if ! git merge-base --is-ancestor "$FROZEN_UPSTREAM_SHA" "$SOURCE_SHA"; then
            echo "::error::Source does not contain frozen official main $FROZEN_UPSTREAM_SHA."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$FROZEN_BETA7_SHA" "$SOURCE_SHA"; then
            echo "::error::Source does not contain official beta.7 $FROZEN_BETA7_SHA."
            exit 1
          fi
          if [[ -n "$(git status --porcelain=v1 --untracked-files=all)" ]]; then
            echo "::error::The build checkout is not clean."
            exit 1
          fi

      - name: Check personal runtime version contract before native build
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          import { parseReleaseVersion } from "./scripts/lib/release-version.mjs";
          import { resolvePackageChangelogVersions } from "./scripts/package-changelog.mjs";

          const root = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const codex = JSON.parse(fs.readFileSync("extensions/codex/package.json", "utf8"));
          assert.equal(process.env.APP_VERSION, process.env.PERSONAL_VERSION);
          assert.equal(process.env.APP_DISPLAY_NAME, process.env.PERSONAL_DISPLAY_NAME);
          assert.equal(
            process.env.APP_BUNDLE_SHORT_VERSION,
            process.env.PERSONAL_APP_BUNDLE_SHORT_VERSION,
          );
          assert.equal(process.env.APP_BUILD, process.env.PERSONAL_APP_BUILD);
          assert.equal(root.version, process.env.APP_VERSION);
          assert.equal(codex.version, process.env.APP_VERSION);
          assert.equal(codex.openclaw?.build?.openclawVersion, process.env.APP_VERSION);
          assert.equal(codex.openclaw?.compat?.pluginApi, `>=${process.env.APP_VERSION}`);
          assert.match(process.env.APP_VERSION, /^2026\.8\.1-selfbuild\.[1-9][0-9]*$/);
          assert.match(process.env.APP_BUNDLE_SHORT_VERSION, /^\d+\.\d+\.\d+$/);
          assert.match(process.env.APP_BUILD, /^[1-9][0-9]*$/);
          assert.equal(parseReleaseVersion(process.env.APP_VERSION), null);
          assert.deepEqual(
            resolvePackageChangelogVersions("2026.8.1-selfbuild.1"),
            ["2026.8.1-selfbuild.1", "2026.8.1", "Unreleased"],
          );
          NODE

      - name: Select pinned Xcode 26.6 and Swift 6.3
        run: |
          set -euo pipefail
          xcode_app="/Applications/Xcode_26.6.app"
          if [[ ! -d "$xcode_app/Contents/Developer" ]]; then
            xcode_app="/Applications/Xcode_26.6.0.app"
          fi
          if [[ ! -d "$xcode_app/Contents/Developer" ]]; then
            echo "::error::Pinned Xcode 26.6 is unavailable on this runner image."
            exit 1
          fi
          sudo xcode-select -s "$xcode_app/Contents/Developer"
          xcodebuild -version
          xcode_version="$(xcodebuild -version | awk 'NR == 1 { print $2 }')"
          if [[ "$xcode_version" != "26.6" ]]; then
            echo "::error::Expected Xcode 26.6, got $xcode_version."
            exit 1
          fi
          source scripts/lib/swift-toolchain.sh
          require_swift_toolchain
          swift_version="$(swift --version)"
          printf '%s\n' "$swift_version"
          swift_major_minor="$(printf '%s\n' "$swift_version" | sed -nE 's/.*Apple Swift version ([0-9]+)\.([0-9]+).*/\1 \2/p' | head -n 1)"
          if [[ -z "$swift_major_minor" ]]; then
            echo "::error::Could not parse the selected Swift toolchain version."
            exit 1
          fi
          read -r swift_major swift_minor <<< "$swift_major_minor"
          if (( swift_major < 6 )) || (( swift_major == 6 && swift_minor < 3 )); then
            echo "::error::The locked MLX package graph requires Swift 6.3+, got $swift_major.$swift_minor."
            exit 1
          fi
          echo "OPENCLAW_XCODE_VERSION=$xcode_version" >> "$GITHUB_ENV"

      - name: Setup pinned Node and pnpm without Actions caches
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          install-bun: "false"
          use-actions-cache: "false"
          save-actions-cache: "false"

      - name: Run personal runtime packaging regression
        run: |
          set -euo pipefail
          node scripts/run-vitest.mjs run \
            test/appcast.test.ts \
            test/scripts/package-changelog.test.ts \
            test/scripts/package-mac-app.test.ts \
            test/scripts/package-mac-dist.test.ts \
            test/scripts/verify-control-ui-release-parity.test.ts
          node --import tsx --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { satisfies, valid } from "semver";
          import { canonicalSparkleBuildFromVersion } from "./scripts/sparkle-build.ts";

          assert.equal(valid(process.env.APP_VERSION), process.env.APP_VERSION);
          assert.equal(satisfies(process.env.APP_VERSION, `>=${process.env.APP_VERSION}`), true);
          const selfBuildFloor = canonicalSparkleBuildFromVersion(process.env.APP_VERSION);
          const officialStableFloor = canonicalSparkleBuildFromVersion(
            process.env.APP_BUNDLE_SHORT_VERSION,
          );
          const selectedBuild = Number(process.env.APP_BUILD);
          assert.equal(selfBuildFloor, 2608000101);
          assert.equal(officialStableFloor, 2608000190);
          assert(selectedBuild > selfBuildFloor);
          assert(selectedBuild < officialStableFloor);
          NODE

      - name: Run macOS identity and retained UI regression suites
        run: |
          set -euo pipefail
          macos_status=0
          swift test \
            --package-path apps/macos \
            --filter 'AppVersionInfoTests|DashboardWindowSmokeTests|WebChatSwiftUISmokeTests|CLIInstallerTests|MacNodeModeCoordinatorTests' \
            --no-parallel || macos_status=$?
          shared_status=0
          swift test \
            --package-path apps/shared/OpenClawKit \
            --filter 'ChatSessionSidebarModelTests|ChatViewModelSessionDeletionTests' \
            --no-parallel || shared_status=$?
          if (( macos_status != 0 || shared_status != 0 )); then
            echo "::error::macOS suite status=$macos_status shared UI suite status=$shared_status"
            exit 1
          fi

      - name: Freeze version and build provenance
        id: release_meta
        run: |
          set -euo pipefail
          actual_version="$(node -p "require('./package.json').version")"
          if [[ "$actual_version" != "$APP_VERSION" ]]; then
            echo "::error::package.json version is $actual_version, expected $APP_VERSION."
            exit 1
          fi
          commit_epoch="$(git show -s --format=%ct "$SOURCE_SHA")"
          build_timestamp="$(
            node -e \
              'process.stdout.write(new Date(Number(process.argv[1]) * 1000).toISOString())' \
              "$commit_epoch"
          )"
          if [[ ! "$build_timestamp" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}Z$ ]]; then
            echo "::error::Could not derive a fixed UTC build timestamp."
            exit 1
          fi
          short_sha="$(printf '%.12s' "$SOURCE_SHA")"
          artifact_name="OpenClaw-$APP_VERSION-macos-universal-$short_sha"
          staging_cache_key="openclaw-macos-intel-stage-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$SOURCE_SHA"
          bundle_dir=".artifacts/personal-release/upload"
          mkdir -p "$bundle_dir"
          echo "OPENCLAW_BUILD_TIMESTAMP=$build_timestamp" >> "$GITHUB_ENV"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "build_timestamp=$build_timestamp" >> "$GITHUB_OUTPUT"
          echo "staging_cache_key=$staging_cache_key" >> "$GITHUB_OUTPUT"
          echo "bundle_dir=$bundle_dir" >> "$GITHUB_OUTPUT"
          {
            echo "Source SHA: $SOURCE_SHA"
            echo "Frozen official SHA: $FROZEN_UPSTREAM_SHA"
            echo "Frozen official beta.7 SHA: $FROZEN_BETA7_SHA"
            echo "Distribution: $APP_DISPLAY_NAME"
            echo "Version: $APP_VERSION"
            echo "Apple version mapping: CFBundleShortVersionString=$APP_BUNDLE_SHORT_VERSION CFBundleVersion=$APP_BUILD"
            echo "Build timestamp: $build_timestamp"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check workflow and available disk
        run: |
          set -euo pipefail
          pnpm check:workflows
          df -h .
          du -sh node_modules 2>/dev/null || true

      - name: Build Core Gateway Control UI and package metadata once
        run: |
          set -euo pipefail
          pnpm build
          test -s dist/build-info.json
          test -s dist/control-ui/index.html
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const info = JSON.parse(fs.readFileSync("dist/build-info.json", "utf8"));
          const expected = {
            version: process.env.APP_VERSION,
            commit: process.env.SOURCE_SHA,
            builtAt: process.env.OPENCLAW_BUILD_TIMESTAMP,
          };
          for (const [key, value] of Object.entries(expected)) {
            if (info[key] !== value) {
              throw new Error("dist/build-info.json " + key + "=" + info[key] + ", expected " + value);
            }
          }
          NODE

      - name: Package current runtime candidate for RED evidence
        if: ${{ inputs.phase == 'red' }}
        id: runtime_red
        run: |
          set -euo pipefail
          runtime_dir=".artifacts/personal-release/runtime-red"
          runtime_name="openclaw-$APP_VERSION-runtime-red.tgz"
          mkdir -p "$runtime_dir"
          node scripts/package-openclaw-for-docker.mjs \
            --skip-build \
            --allow-unreleased-changelog \
            --output-dir "$runtime_dir" \
            --output-name "$runtime_name"
          runtime_path="$PWD/$runtime_dir/$runtime_name"
          test -s "$runtime_path"
          echo "runtime_path=$runtime_path" >> "$GITHUB_OUTPUT"

      - name: Verify current runtime candidate dependency closure
        if: ${{ inputs.phase == 'red' }}
        env:
          RUNTIME_TGZ: ${{ steps.runtime_red.outputs.runtime_path }}
        run: |
          set -euo pipefail
          runtime_check="$RUNNER_TEMP/openclaw-runtime-red-check"
          rm -rf "$runtime_check"
          mkdir -p "$runtime_check"
          tar -xzf "$RUNTIME_TGZ" -C "$runtime_check"
          runtime_package="$runtime_check/package"
          test -s "$runtime_package/package.json"
          env -u NODE_PATH RUNTIME_ROOT="$runtime_package" node --input-type=module <<'NODE'
          import { createRequire } from "node:module";
          import fs from "node:fs";
          import path from "node:path";

          const runtimeRoot = process.env.RUNTIME_ROOT;
          const runtimePackage = JSON.parse(
            fs.readFileSync(path.join(runtimeRoot, "package.json"), "utf8"),
          );
          const runtimeRequire = createRequire(path.join(runtimeRoot, "package.json"));
          const missing = Object.keys(runtimePackage.dependencies ?? {}).filter((name) => {
            try {
              runtimeRequire.resolve(name);
              return false;
            } catch {
              return true;
            }
          });
          if (missing.length > 0) {
            throw new Error(
              "packaged runtime has unresolved production dependencies: " + missing.join(", "),
            );
          }
          NODE
          runtime_smoke_home="$RUNNER_TEMP/openclaw-runtime-red-home"
          mkdir -p "$runtime_smoke_home"
          env -u NODE_PATH \
            HOME="$runtime_smoke_home" \
            OPENCLAW_STATE_DIR="$runtime_smoke_home/.openclaw" \
            node "$runtime_package/openclaw.mjs" doctor --non-interactive

      - name: Build universal ad-hoc signed App ZIP and DMG
        env:
          BUILD_ARCHS: "all"
          BUILD_CONFIG: "release"
          SIGN_IDENTITY: "-"
          ALLOW_ADHOC_SIGNING: "1"
          CODESIGN_TIMESTAMP: "off"
          SKIP_NOTARIZE: "1"
          SKIP_DSYM: "1"
          SKIP_PNPM_INSTALL: "1"
          SKIP_TSC: "1"
          SKIP_UI_BUILD: "1"
        run: |
          set -euo pipefail
          bash scripts/package-mac-dist.sh
          test -d dist/OpenClaw.app
          test -s "dist/OpenClaw-$APP_VERSION.zip"
          test -s "dist/OpenClaw-$APP_VERSION.dmg"
          df -h .

      - name: Package same-checkout raw npm source archive
        id: source_package
        run: |
          set -euo pipefail
          package_dir=".artifacts/personal-release/runtime-source"
          short_sha="$(printf '%.12s' "$SOURCE_SHA")"
          raw_package_name="openclaw-$APP_VERSION-source-npm-$short_sha.tgz"
          mkdir -p "$package_dir"
          node scripts/package-openclaw-for-docker.mjs \
            --skip-build \
            --allow-unreleased-changelog \
            --output-dir "$package_dir" \
            --output-name "$raw_package_name"
          raw_package_path="$PWD/$package_dir/$raw_package_name"
          test -s "$raw_package_path"
          echo "raw_package_path=$raw_package_path" >> "$GITHUB_OUTPUT"
          echo "raw_package_name=$raw_package_name" >> "$GITHUB_OUTPUT"

      - name: Pack matching Codex plugin from the frozen source
        id: codex_package
        env:
          BUNDLE_DIR: ${{ steps.release_meta.outputs.bundle_dir }}
        run: |
          set -euo pipefail
          codex_pack_dir=".artifacts/personal-release/codex-plugin"
          mkdir -p "$codex_pack_dir" "$BUNDLE_DIR"
          node scripts/lib/plugin-npm-runtime-build.mjs extensions/codex
          node scripts/generate-npm-package-lock.mjs --package-dir extensions/codex
          OPENCLAW_PLUGIN_NPM_BUNDLE_DEPENDENCIES=1 \
            node scripts/lib/plugin-npm-package-manifest.mjs \
              --run extensions/codex -- \
              npm pack --json --ignore-scripts --pack-destination "$PWD/$codex_pack_dir"
          shopt -s nullglob
          codex_packages=("$codex_pack_dir"/*.tgz)
          shopt -u nullglob
          if (( ${#codex_packages[@]} != 1 )); then
            echo "::error::Expected exactly one Codex plugin archive, found ${#codex_packages[@]}."
            exit 1
          fi
          codex_package_path="${codex_packages[0]}"
          codex_package_name="$(basename "$codex_package_path")"
          codex_check="$RUNNER_TEMP/openclaw-codex-package-check"
          mkdir -p "$codex_check"
          tar -xzf "$codex_package_path" -C "$codex_check"
          CODEX_PACKAGE_ROOT="$codex_check/package" node --input-type=module <<'NODE'
          import fs from "node:fs";
          import path from "node:path";
          const manifest = JSON.parse(
            fs.readFileSync(path.join(process.env.CODEX_PACKAGE_ROOT, "package.json"), "utf8"),
          );
          const expectedPeer = `>=${process.env.APP_VERSION}`;
          if (manifest.name !== "@openclaw/codex") throw new Error("unexpected Codex package name");
          if (manifest.version !== process.env.APP_VERSION) throw new Error("Codex version mismatch");
          if (manifest.openclaw?.build?.openclawVersion !== process.env.APP_VERSION) {
            throw new Error("Codex build host version mismatch");
          }
          if (manifest.openclaw?.compat?.pluginApi !== expectedPeer) {
            throw new Error("Codex plugin API range mismatch");
          }
          if (manifest.peerDependencies?.openclaw !== expectedPeer) {
            throw new Error("Codex OpenClaw peer range mismatch");
          }
          if (manifest.peerDependenciesMeta?.openclaw?.optional !== true) {
            throw new Error("Codex OpenClaw peer must be optional for managed linking");
          }
          if (!Array.isArray(manifest.openclaw?.runtimeExtensions)) {
            throw new Error("Codex runtime extension metadata is missing");
          }
          NODE
          cp "$codex_package_path" "$BUNDLE_DIR/$codex_package_name"
          (cd "$BUNDLE_DIR" && shasum -a 256 "$codex_package_name") \
            | tee "$BUNDLE_DIR/codex-plugin.sha256"
          echo "codex_package_name=$codex_package_name" >> "$GITHUB_OUTPUT"

      - name: Verify App and raw npm source package signing architectures and Control UI
        env:
          RAW_PACKAGE_TGZ: ${{ steps.source_package.outputs.raw_package_path }}
          RAW_PACKAGE_NAME: ${{ steps.source_package.outputs.raw_package_name }}
          BUNDLE_DIR: ${{ steps.release_meta.outputs.bundle_dir }}
        run: |
          set -euo pipefail
          app="dist/OpenClaw.app"
          zip="dist/OpenClaw-$APP_VERSION.zip"
          dmg="dist/OpenClaw-$APP_VERSION.dmg"
          plist_value() {
            /usr/libexec/PlistBuddy -c "Print :$2" "$1/Contents/Info.plist"
          }
          verify_app_metadata() {
            local candidate="$1"
            [[ "$(plist_value "$candidate" CFBundleIdentifier)" == "$BUNDLE_ID" ]]
            [[ "$(plist_value "$candidate" CFBundleShortVersionString)" == "$APP_BUNDLE_SHORT_VERSION" ]]
            [[ "$(plist_value "$candidate" CFBundleVersion)" == "$APP_BUILD" ]]
            [[ "$(plist_value "$candidate" OpenClawProductVersion)" == "$APP_VERSION" ]]
            [[ "$(plist_value "$candidate" OpenClawDistributionName)" == "$APP_DISPLAY_NAME" ]]
            [[ "$(plist_value "$candidate" OpenClawGitCommit)" == "$SOURCE_SHA" ]]
            [[ "$(plist_value "$candidate" OpenClawBuildTimestamp)" == "$OPENCLAW_BUILD_TIMESTAMP" ]]
            codesign --verify --deep --strict --verbose=4 "$candidate"
          }
          require_universal() {
            local candidate="$1"
            local architectures
            architectures="$(lipo -archs "$candidate")"
            printf '%s\t%s\n' "$candidate" "$architectures" >> "$BUNDLE_DIR/architectures.txt"
            if [[ " $architectures " != *" arm64 "* || " $architectures " != *" x86_64 "* ]]; then
              echo "::error::$candidate is not universal arm64+x86_64: $architectures"
              exit 1
            fi
          }
          mkdir -p "$BUNDLE_DIR"
          cp "$zip" "$BUNDLE_DIR/"
          cp "$dmg" "$BUNDLE_DIR/"
          cp "$RAW_PACKAGE_TGZ" "$BUNDLE_DIR/"
          verify_app_metadata "$app"
          codesign -dv --verbose=4 "$app" >"$BUNDLE_DIR/signature.txt" 2>&1
          cat "$BUNDLE_DIR/signature.txt"
          if ! grep -Fxq "Signature=adhoc" "$BUNDLE_DIR/signature.txt"; then
            echo "::error::Expected an ad-hoc signed application."
            exit 1
          fi
          : >"$BUNDLE_DIR/architectures.txt"
          require_universal "$app/Contents/MacOS/OpenClaw"
          require_universal "$app/Contents/MacOS/openclaw-mlx-tts"
          sparkle_root="$app/Contents/Frameworks/Sparkle.framework"
          sparkle_macho_count=0
          while IFS= read -r -d '' candidate; do
            if file "$candidate" | grep -q "Mach-O"; then
              require_universal "$candidate"
              ((sparkle_macho_count += 1))
            fi
          done < <(find "$sparkle_root" -type f -print0)
          if (( sparkle_macho_count == 0 )); then
            echo "::error::No Sparkle Mach-O binaries were found."
            exit 1
          fi
          zip_check="$RUNNER_TEMP/openclaw-zip-check"
          rm -rf "$zip_check"
          mkdir -p "$zip_check"
          ditto -x -k "$zip" "$zip_check"
          verify_app_metadata "$zip_check/OpenClaw.app"
          hdiutil verify "$dmg"
          dmg_mount="$RUNNER_TEMP/openclaw-dmg-check"
          rm -rf "$dmg_mount"
          mkdir -p "$dmg_mount"
          dmg_attached=0
          cleanup_dmg_check() {
            if [[ "$dmg_attached" == "1" ]]; then
              hdiutil detach "$dmg_mount" -force >/dev/null 2>&1 || true
            fi
          }
          trap cleanup_dmg_check EXIT
          hdiutil attach -readonly -nobrowse -mountpoint "$dmg_mount" "$dmg" >/dev/null
          dmg_attached=1
          verify_app_metadata "$dmg_mount/OpenClaw.app"
          hdiutil detach "$dmg_mount" >/dev/null
          dmg_attached=0
          trap - EXIT
          raw_package_check="$RUNNER_TEMP/openclaw-runtime-check"
          rm -rf "$raw_package_check"
          mkdir -p "$raw_package_check"
          tar -xzf "$RAW_PACKAGE_TGZ" -C "$raw_package_check"
          raw_package="$raw_package_check/package"
          test -s "$raw_package/package.json"
          test -s "$raw_package/dist/build-info.json"
          test -s "$raw_package/dist/control-ui/index.html"
          ROOT_UI="$PWD/dist/control-ui" \
          APP_UI="$PWD/$app/Contents/Resources/control-ui" \
          RUNTIME_UI="$raw_package/dist/control-ui" \
          MANIFEST_DIR="$BUNDLE_DIR" \
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { writeControlUiReleaseParityReport } from "./scripts/verify-control-ui-release-parity.mjs";

          const packageJson = JSON.parse(fs.readFileSync("package.json", "utf8"));
          writeControlUiReleaseParityReport({
            rootUi: process.env.ROOT_UI,
            appUi: process.env.APP_UI,
            runtimeUi: process.env.RUNTIME_UI,
            manifestDir: process.env.MANIFEST_DIR,
            packageFiles: packageJson.files,
          });
          NODE
          RAW_PACKAGE_ROOT="$raw_package" node --input-type=module <<'NODE'
          import fs from "node:fs";
          import path from "node:path";
          const expected = {
            version: process.env.APP_VERSION,
            commit: process.env.SOURCE_SHA,
            builtAt: process.env.OPENCLAW_BUILD_TIMESTAMP,
          };
          const runtimePackage = JSON.parse(fs.readFileSync(path.join(process.env.RAW_PACKAGE_ROOT, "package.json"), "utf8"));
          if (runtimePackage.version !== expected.version) {
            throw new Error("runtime package version " + runtimePackage.version + ", expected " + expected.version);
          }
          for (const file of ["dist/build-info.json", path.join(process.env.RAW_PACKAGE_ROOT, "dist/build-info.json")]) {
            const info = JSON.parse(fs.readFileSync(file, "utf8"));
            for (const [key, value] of Object.entries(expected)) {
              if (info[key] !== value) {
                throw new Error(file + " " + key + "=" + info[key] + ", expected " + value);
              }
            }
          }
          NODE
          root_manifest_sha="$(shasum -a 256 "$BUNDLE_DIR/control-ui-root.manifest.json" | awk '{print $1}')"
          app_manifest_sha="$(shasum -a 256 "$BUNDLE_DIR/control-ui-app.manifest.json" | awk '{print $1}')"
          root_runtime_manifest_sha="$(shasum -a 256 "$BUNDLE_DIR/control-ui-root-runtime.manifest.json" | awk '{print $1}')"
          runtime_manifest_sha="$(shasum -a 256 "$BUNDLE_DIR/control-ui-runtime.manifest.json" | awk '{print $1}')"
          if [[ "$root_manifest_sha" != "$app_manifest_sha" ]]; then
            echo "::error::Root and App Control UI manifests differ."
            exit 1
          fi
          if [[ "$root_runtime_manifest_sha" != "$runtime_manifest_sha" ]]; then
            echo "::error::Packable root and runtime Control UI manifests differ."
            exit 1
          fi
          printf '%s  control-ui-root-app-full\n%s  control-ui-root-runtime-package\n' \
            "$root_manifest_sha" \
            "$root_runtime_manifest_sha" \
            >"$BUNDLE_DIR/control-ui-manifest.sha256"

      - name: Write immutable Intel staging receipt and checksums
        env:
          BUNDLE_DIR: ${{ steps.release_meta.outputs.bundle_dir }}
          RAW_PACKAGE_NAME: ${{ steps.source_package.outputs.raw_package_name }}
          CODEX_PACKAGE_NAME: ${{ steps.codex_package.outputs.codex_package_name }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import crypto from "node:crypto";
          import fs from "node:fs";
          import path from "node:path";
          const bundleDir = process.env.BUNDLE_DIR;
          const rawPackage = path.join(bundleDir, process.env.RAW_PACKAGE_NAME);
          const codexPackage = path.join(bundleDir, process.env.CODEX_PACKAGE_NAME);
          const appExecutable = path.join("dist", "OpenClaw.app", "Contents", "MacOS", "OpenClaw");
          const rawSha256 = crypto.createHash("sha256").update(fs.readFileSync(rawPackage)).digest("hex");
          const codexSha256 = crypto.createHash("sha256").update(fs.readFileSync(codexPackage)).digest("hex");
          const appExecutableSha256 = crypto.createHash("sha256").update(fs.readFileSync(appExecutable)).digest("hex");
          const receipt = {
            schemaVersion: 1,
            purpose: "immutable Intel-built components for ARM64 runtime assembly",
            sourceSha: process.env.SOURCE_SHA,
            frozenOfficialSha: process.env.FROZEN_UPSTREAM_SHA,
            frozenOfficialBeta7Sha: process.env.FROZEN_BETA7_SHA,
            officialBetaVersion: process.env.OFFICIAL_BETA_VERSION,
            distributionName: process.env.APP_DISPLAY_NAME,
            version: process.env.APP_VERSION,
            appBundleShortVersion: process.env.APP_BUNDLE_SHORT_VERSION,
            appBuild: process.env.APP_BUILD,
            unofficialSelfBuild: true,
            buildTimestamp: process.env.OPENCLAW_BUILD_TIMESTAMP,
            workflowRunId: process.env.GITHUB_RUN_ID,
            workflowRunAttempt: process.env.GITHUB_RUN_ATTEMPT,
            runner: "macos-26-intel",
            runnerArch: process.env.RUNNER_ARCH,
            xcode: process.env.OPENCLAW_XCODE_VERSION,
            appArchitectures: ["arm64", "x86_64"],
            appSignature: "ad-hoc",
            appExecutableSha256,
            rawNpmArchive: process.env.RAW_PACKAGE_NAME,
            rawNpmSha256: rawSha256,
            codexPluginArchive: process.env.CODEX_PACKAGE_NAME,
            codexPluginSha256: codexSha256,
          };
          fs.writeFileSync(
            path.join(bundleDir, "intel-build-receipt.json"),
            JSON.stringify(receipt, null, 2) + "\n",
          );
          NODE
          node --input-type=module <<'NODE'
          import crypto from "node:crypto";
          import fs from "node:fs";
          import path from "node:path";
          const bundleDir = process.env.BUNDLE_DIR;
          const lines = fs
            .readdirSync(bundleDir)
            .filter((name) => name !== "INTEL-STAGING-SHA256SUMS")
            .filter((name) => fs.statSync(path.join(bundleDir, name)).isFile())
            .toSorted()
            .map((name) => crypto.createHash("sha256").update(fs.readFileSync(path.join(bundleDir, name))).digest("hex") + "  " + name);
          fs.writeFileSync(path.join(bundleDir, "INTEL-STAGING-SHA256SUMS"), lines.join("\n") + "\n");
          NODE
          (cd "$BUNDLE_DIR" && shasum -a 256 -c INTEL-STAGING-SHA256SUMS)
          {
            echo "## Intel staging components ready"
            echo
            echo "- Version: $APP_VERSION"
            echo "- Build: $APP_BUILD"
            echo "- Source: $SOURCE_SHA"
            echo "- App: universal arm64 + x86_64, ad-hoc signed"
            echo "- Runtime input: raw npm source archive; not a runnable runtime"
            echo "- Next: native macos-26 ARM64 installation and validation"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save immutable Intel staging components to Actions cache
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .artifacts/personal-release/upload
          key: ${{ steps.release_meta.outputs.staging_cache_key }}

  macos_runtime_arm64:
    if: ${{ (inputs.suite == 'personal-macos-package' && inputs.phase == 'green') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[package]')) }}
    needs: [focused_validation, macos_package]
    permissions:
      contents: read
    name: Assemble and validate OpenClaw 2026.8.1 Self-Built Beta 1 darwin-arm64 runtime
    runs-on: macos-26
    timeout-minutes: 180
    env:
      SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
      GIT_COMMIT: ${{ inputs.source_sha || github.sha }}
      APP_VERSION: "2026.8.1-selfbuild.1"
      APP_DISPLAY_NAME: "OpenClaw 2026.8.1 Self-Built Beta 1"
      APP_BUNDLE_SHORT_VERSION: "2026.8.1"
      APP_BUILD: "2608000189"
      BUNDLE_ID: "ai.openclaw.mac"
      OPENCLAW_BUILD_TIMESTAMP: ${{ needs.macos_package.outputs.build_timestamp }}
      RAW_PACKAGE_NAME: ${{ needs.macos_package.outputs.raw_package_name }}
      CODEX_PACKAGE_NAME: ${{ needs.macos_package.outputs.codex_package_name }}
      FINAL_ARTIFACT_NAME: ${{ needs.macos_package.outputs.artifact_name }}
      STAGING_CACHE_KEY: ${{ needs.macos_package.outputs.staging_cache_key }}
      BUNDLE_DIR: ${{ github.workspace }}/.artifacts/personal-release/upload
      FINAL_DIR: ${{ github.workspace }}/.artifacts/personal-release/final-upload
      NODE_OPTIONS: "--max-old-space-size=4096"

    steps:
      - name: Validate immutable public ARM64 build dispatch
        env:
          EVENT_SHA: ${{ github.sha }}
          CURRENT_REPOSITORY: ${{ github.repository }}
          REPOSITORY_IS_PRIVATE: ${{ github.event.repository.private }}
          CURRENT_REF: ${{ github.ref }}
          TDD_PHASE: ${{ inputs.phase || (contains(github.event.head_commit.message, '[package]') && 'green' || 'red') }}
        run: |
          set -euo pipefail
          if [[ "$CURRENT_REPOSITORY" != "$PERSONAL_RELEASE_REPOSITORY" ]]; then
            echo "::error::This workflow is restricted to $PERSONAL_RELEASE_REPOSITORY."
            exit 1
          fi
          if [[ "$REPOSITORY_IS_PRIVATE" != "false" ]]; then
            echo "::error::The personal build must use a public repository and standard free runners."
            exit 1
          fi
          if [[ "$CURRENT_REF" != "refs/heads/agent/openclaw-beta-5-1" ]]; then
            echo "::error::Dispatch the one existing personal repair branch."
            exit 1
          fi
          if [[ "$TDD_PHASE" != "green" ]]; then
            echo "::error::ARM64 runtime assembly is a GREEN-only delivery step."
            exit 1
          fi
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::source_sha must be a full lowercase Git SHA."
            exit 1
          fi
          if [[ "$EVENT_SHA" != "$SOURCE_SHA" ]]; then
            echo "::error::The dispatched ref resolved to $EVENT_SHA, expected $SOURCE_SHA."
            exit 1
          fi
          if [[ "$RUNNER_ARCH" != "ARM64" || "$(uname -m)" != "arm64" ]]; then
            echo "::error::Expected standard macos-26 ARM64 runner; RUNNER_ARCH=$RUNNER_ARCH uname=$(uname -m)."
            exit 1
          fi

      - name: Checkout exact frozen source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 200
          persist-credentials: false

      - name: Verify frozen official ancestry on ARM64
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "$SOURCE_SHA" ]]; then
            echo "::error::Checkout did not resolve to $SOURCE_SHA."
            exit 1
          fi
          official_remote="official-openclaw"
          official_url="https://github.com/openclaw/openclaw.git"
          if git remote get-url "$official_remote" >/dev/null 2>&1; then
            git remote set-url "$official_remote" "$official_url"
          else
            git remote add "$official_remote" "$official_url"
          fi
          git fetch --no-tags --filter=blob:none "$official_remote" \
            "$FROZEN_UPSTREAM_SHA" "$FROZEN_BETA7_SHA"
          if ! git merge-base --is-ancestor "$FROZEN_UPSTREAM_SHA" "$SOURCE_SHA"; then
            echo "::error::Source does not contain frozen official main $FROZEN_UPSTREAM_SHA."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$FROZEN_BETA7_SHA" "$SOURCE_SHA"; then
            echo "::error::Source does not contain official beta.7 $FROZEN_BETA7_SHA."
            exit 1
          fi
          if [[ -n "$(git status --porcelain=v1 --untracked-files=all)" ]]; then
            echo "::error::The ARM64 checkout is not clean."
            exit 1
          fi

      - name: Setup pinned Node 24 on ARM64
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: false

      - name: Verify native Node architecture
        run: |
          set -euo pipefail
          node --version
          npm --version
          if [[ "$(node -p 'process.arch')" != "arm64" ]]; then
            echo "::error::Expected arm64 Node runtime."
            exit 1
          fi

      - name: Restore immutable Intel staging components
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .artifacts/personal-release/upload
          key: ${{ env.STAGING_CACHE_KEY }}
          fail-on-cache-miss: true

      - name: Verify Intel staging component checksums
        run: |
          set -euo pipefail
          test -s "$BUNDLE_DIR/INTEL-STAGING-SHA256SUMS"
          test -s "$BUNDLE_DIR/$RAW_PACKAGE_NAME"
          test -n "$CODEX_PACKAGE_NAME"
          test -s "$BUNDLE_DIR/$CODEX_PACKAGE_NAME"
          test -s "$BUNDLE_DIR/intel-build-receipt.json"
          (cd "$BUNDLE_DIR" && shasum -a 256 -c INTEL-STAGING-SHA256SUMS)
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import crypto from "node:crypto";
          import path from "node:path";
          const receipt = JSON.parse(fs.readFileSync(process.env.BUNDLE_DIR + "/intel-build-receipt.json", "utf8"));
          const rawPackage = path.join(process.env.BUNDLE_DIR, process.env.RAW_PACKAGE_NAME);
          const codexPackage = path.join(process.env.BUNDLE_DIR, process.env.CODEX_PACKAGE_NAME);
          const rawNpmSha256 = crypto.createHash("sha256").update(fs.readFileSync(rawPackage)).digest("hex");
          const codexPluginSha256 = crypto.createHash("sha256").update(fs.readFileSync(codexPackage)).digest("hex");
          const expected = {
            sourceSha: process.env.SOURCE_SHA,
            frozenOfficialSha: process.env.FROZEN_UPSTREAM_SHA,
            frozenOfficialBeta7Sha: process.env.FROZEN_BETA7_SHA,
            officialBetaVersion: process.env.OFFICIAL_BETA_VERSION,
            distributionName: process.env.APP_DISPLAY_NAME,
            version: process.env.APP_VERSION,
            appBundleShortVersion: process.env.APP_BUNDLE_SHORT_VERSION,
            appBuild: process.env.APP_BUILD,
            unofficialSelfBuild: true,
            buildTimestamp: process.env.OPENCLAW_BUILD_TIMESTAMP,
            runner: "macos-26-intel",
            runnerArch: "X64",
            rawNpmArchive: process.env.RAW_PACKAGE_NAME,
            rawNpmSha256,
            codexPluginArchive: process.env.CODEX_PACKAGE_NAME,
            codexPluginSha256,
          };
          for (const [key, value] of Object.entries(expected)) {
            if (receipt[key] !== value) {
              throw new Error("Intel receipt " + key + "=" + receipt[key] + ", expected " + value);
            }
          }
          NODE

      - name: Install production dependency closure and package ARM64 runtime
        id: arm_runtime
        run: |
          set -euo pipefail
          raw_package="$BUNDLE_DIR/$RAW_PACKAGE_NAME"
          runtime_prefix="$RUNNER_TEMP/openclaw-installed-prefix"
          npm_cache="$RUNNER_TEMP/openclaw-npm-cache"
          archive_root="$RUNNER_TEMP/openclaw-runtime-archive"
          mkdir -p "$runtime_prefix" "$npm_cache" "$archive_root"
          (
            cd "$RUNNER_TEMP"
            env -u NODE_PATH -u npm_config_arch -u npm_config_platform \
              npm_config_cache="$npm_cache" \
              npm install --global \
                --prefix "$runtime_prefix" \
                --omit=dev \
                --include=optional \
                --no-audit \
                --no-fund \
                "$raw_package"
          )
          runtime_root="$(npm root --global --prefix "$runtime_prefix")/openclaw"
          test -s "$runtime_root/openclaw.mjs"
          test -d "$runtime_root/node_modules"
          test -s "$runtime_root/dist/build-info.json"
          test -s "$runtime_root/dist/control-ui/index.html"
          npm ls --global --prefix "$runtime_prefix" --omit=dev --all --json > "$BUNDLE_DIR/runtime-npm-tree.json"
          raw_sha="$(shasum -a 256 "$raw_package" | awk '{print $1}')"
          npm_version="$(npm --version)"
          short_sha="$(printf '%.12s' "$SOURCE_SHA")"
          runtime_name="openclaw-$APP_VERSION-runtime-darwin-arm64-$short_sha.tgz"
          mv "$runtime_root" "$archive_root/package"
          COPYFILE_DISABLE=1 tar -czf "$BUNDLE_DIR/$runtime_name" -C "$archive_root" package
          test -s "$BUNDLE_DIR/$runtime_name"
          echo "runtime_name=$runtime_name" >> "$GITHUB_OUTPUT"
          echo "runtime_path=$BUNDLE_DIR/$runtime_name" >> "$GITHUB_OUTPUT"
          echo "raw_sha=$raw_sha" >> "$GITHUB_OUTPUT"
          echo "npm_version=$npm_version" >> "$GITHUB_OUTPUT"

      - name: Verify runnable self-contained ARM64 runtime
        env:
          RUNTIME_TGZ: ${{ steps.arm_runtime.outputs.runtime_path }}
        run: |
          set -euo pipefail
          runtime_check="$RUNNER_TEMP/openclaw-runtime-final-check"
          mkdir -p "$runtime_check"
          tar -xzf "$RUNTIME_TGZ" -C "$runtime_check"
          runtime_package="$runtime_check/package"
          test -s "$runtime_package/package.json"
          test -s "$runtime_package/openclaw.mjs"
          test -s "$runtime_package/dist/build-info.json"
          test -s "$runtime_package/dist/control-ui/index.html"
          npm ls --prefix "$runtime_package" --omit=dev --all --json             > "$BUNDLE_DIR/runtime-npm-tree-unpacked.json"
          env -u NODE_PATH RUNTIME_ROOT="$runtime_package" node --input-type=module <<'NODE'
          import { createRequire } from "node:module";
          import fs from "node:fs";
          import path from "node:path";
          const runtimeRoot = fs.realpathSync(process.env.RUNTIME_ROOT);
          const packageJson = JSON.parse(fs.readFileSync(path.join(runtimeRoot, "package.json"), "utf8"));
          const runtimeRequire = createRequire(path.join(runtimeRoot, "package.json"));
          const failures = [];
          const verifyContainedPath = (label, candidate) => {
            const relative = path.relative(runtimeRoot, candidate);
            if (relative.startsWith(".." + path.sep) || path.isAbsolute(relative)) {
              failures.push(label + " resolved outside runtime: " + candidate);
            }
          };
          for (const name of Object.keys(packageJson.dependencies ?? {})) {
            try {
              // A package may intentionally omit a CommonJS root export. Validate the
              // installed package directory here; actual ESM entrypoints are loaded below.
              const packageDirectory = path.join(runtimeRoot, "node_modules", ...name.split("/"));
              const resolvedDirectory = fs.realpathSync(packageDirectory);
              verifyContainedPath(name, resolvedDirectory);
              if (!fs.statSync(resolvedDirectory).isDirectory()) {
                failures.push(name + " is not an installed package directory");
                continue;
              }
              const dependencyManifest = JSON.parse(
                fs.readFileSync(path.join(resolvedDirectory, "package.json"), "utf8"),
              );
              if (dependencyManifest.name !== name) {
                failures.push(name + " manifest identifies itself as " + dependencyManifest.name);
              }
              if (typeof dependencyManifest.version !== "string" || dependencyManifest.version.length === 0) {
                failures.push(name + " has no package version");
              }
            } catch (error) {
              failures.push(name + " package directory invalid: " + String(error));
            }
          }
          function verifyContainedSymlinks(directory) {
            for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
              const candidate = path.join(directory, entry.name);
              if (entry.isSymbolicLink()) {
                try {
                  const resolved = fs.realpathSync(candidate);
                  const relative = path.relative(runtimeRoot, resolved);
                  if (relative.startsWith(".." + path.sep) || path.isAbsolute(relative)) {
                    failures.push("symlink escapes runtime: " + candidate + " -> " + resolved);
                  }
                } catch (error) {
                  failures.push("broken symlink: " + candidate + ": " + String(error));
                }
                continue;
              }
              if (entry.isDirectory()) {
                verifyContainedSymlinks(candidate);
              }
            }
          }
          verifyContainedSymlinks(runtimeRoot);
          if (failures.length > 0) {
            throw new Error("installed runtime dependency closure failed:\n" + failures.join("\n"));
          }
          const tslogEntry = fs.realpathSync(runtimeRequire.resolve("tslog"));
          verifyContainedPath("tslog", tslogEntry);
          if (failures.length > 0) {
            throw new Error("installed runtime dependency closure failed:\n" + failures.join("\n"));
          }
          NODE
          (
            cd "$runtime_package"
            env -u NODE_PATH -u NODE_OPTIONS node --input-type=module <<'NODE'
          const probes = [
            ["@modelcontextprotocol/sdk/client/auth.js", ["auth", "extractWWWAuthenticateParams"]],
            ["@modelcontextprotocol/sdk/client/index.js", ["Client"]],
            ["@modelcontextprotocol/sdk/client/sse.js", ["SSEClientTransport"]],
            ["@modelcontextprotocol/sdk/client/stdio.js", ["StdioClientTransport", "getDefaultEnvironment"]],
            ["@modelcontextprotocol/sdk/client/streamableHttp.js", ["StreamableHTTPClientTransport", "StreamableHTTPError"]],
            ["@modelcontextprotocol/sdk/server/index.js", ["Server"]],
            ["@modelcontextprotocol/sdk/server/mcp.js", ["McpServer"]],
            ["@modelcontextprotocol/sdk/server/stdio.js", ["StdioServerTransport"]],
            ["@modelcontextprotocol/sdk/shared/auth.js", ["OAuthTokensSchema"]],
            ["@modelcontextprotocol/sdk/shared/stdio.js", ["ReadBuffer", "serializeMessage"]],
            ["@modelcontextprotocol/sdk/types.js", ["ContentBlockSchema", "ErrorCode"]],
            ["@modelcontextprotocol/sdk/validation/ajv-provider.js", ["AjvJsonSchemaValidator"]],
          ];
          for (const [specifier, expectedExports] of probes) {
            const namespace = await import(specifier);
            for (const expectedExport of expectedExports) {
              if (!Object.hasOwn(namespace, expectedExport)) {
                throw new Error(specifier + " lacks export " + expectedExport);
              }
            }
            console.log("ESM import: " + specifier + " ok");
          }
          const clawpdf = await import("clawpdf");
          if (typeof clawpdf.createEngine !== "function") {
            throw new Error("clawpdf lacks createEngine()");
          }
          const engine = await clawpdf.createEngine();
          try {
            if (typeof engine.pdfiumRelease !== "string" || engine.pdfiumRelease.length === 0) {
              throw new Error("clawpdf PDFium engine did not expose a release");
            }
            if (typeof engine.wasmSha256 !== "string" || engine.wasmSha256.length === 0) {
              throw new Error("clawpdf PDFium engine did not expose a WASM digest");
            }
            console.log("clawpdf PDFium engine: " + engine.pdfiumRelease + " ok");
          } finally {
            await engine.destroy();
          }
          NODE
          )
          runtime_smoke_home="$RUNNER_TEMP/openclaw-runtime-smoke-home"
          mkdir -p "$runtime_smoke_home"
          version_output="$(
            env -u NODE_PATH \
              HOME="$runtime_smoke_home" \
              OPENCLAW_STATE_DIR="$runtime_smoke_home/.openclaw" \
              node "$runtime_package/openclaw.mjs" --version
          )"
          expected_version_output="OpenClaw $APP_VERSION ($(printf '%.7s' "$SOURCE_SHA"))"
          if [[ "$version_output" != "$expected_version_output" ]]; then
            echo "::error::Unexpected runtime version: $version_output; expected $expected_version_output"
            exit 1
          fi
          env -u NODE_PATH HOME="$runtime_smoke_home" OPENCLAW_STATE_DIR="$runtime_smoke_home/.openclaw" \
            node "$runtime_package/openclaw.mjs" gateway --help >/dev/null
          env -u NODE_PATH HOME="$runtime_smoke_home" OPENCLAW_STATE_DIR="$runtime_smoke_home/.openclaw" \
            node "$runtime_package/openclaw.mjs" doctor --non-interactive \
            | tee "$BUNDLE_DIR/runtime-doctor-smoke.txt"
          pty_node="$(find "$runtime_package/node_modules" -path '*/@lydell/node-pty-darwin-arm64/prebuilds/darwin-arm64/pty.node' -type f -print -quit)"
          spawn_helper="$(find "$runtime_package/node_modules" -path '*/@lydell/node-pty-darwin-arm64/prebuilds/darwin-arm64/spawn-helper' -type f -print -quit)"
          sqlite_vec="$(find "$runtime_package/node_modules" -path '*/sqlite-vec-darwin-arm64/vec0.dylib' -type f -print -quit)"
          test -n "$pty_node"
          test -n "$spawn_helper"
          test -n "$sqlite_vec"
          test -x "$spawn_helper"
          [[ "$(lipo -archs "$pty_node")" == "arm64" ]]
          [[ "$(lipo -archs "$spawn_helper")" == "arm64" ]]
          [[ "$(lipo -archs "$sqlite_vec")" == "arm64" ]]
          if find "$runtime_package/node_modules" -type d \( -name 'node-pty-darwin-x64' -o -name 'sqlite-vec-darwin-x64' \) -print -quit | grep -q .; then
            echo "::error::ARM64 runtime contains a darwin-x64 native optional package."
            exit 1
          fi
          {
            file "$pty_node"
            file "$spawn_helper"
            file "$sqlite_vec"
          } | tee "$BUNDLE_DIR/runtime-arm64-native.txt"
          env -u NODE_PATH RUNTIME_ROOT="$runtime_package" node --input-type=module <<'NODE'
          import { createRequire } from "node:module";
          import fs from "node:fs";
          import path from "node:path";
          import { DatabaseSync } from "node:sqlite";
          const runtimeRoot = fs.realpathSync(process.env.RUNTIME_ROOT);
          const runtimeRequire = createRequire(path.join(runtimeRoot, "package.json"));
          const pty = runtimeRequire("@lydell/node-pty");
          if (typeof pty.spawn !== "function") throw new Error("@lydell/node-pty did not expose spawn()");
          const sqliteVec = runtimeRequire("sqlite-vec");
          const extensionPath = fs.realpathSync(sqliteVec.getLoadablePath());
          const relative = path.relative(runtimeRoot, extensionPath);
          if (relative.startsWith(".." + path.sep) || path.isAbsolute(relative) || !extensionPath.includes("sqlite-vec-darwin-arm64")) {
            throw new Error("sqlite-vec resolved outside the ARM64 runtime: " + extensionPath);
          }
          const db = new DatabaseSync(":memory:", { allowExtension: true });
          sqliteVec.load(db);
          const row = db.prepare("SELECT vec_version() AS version").get();
          db.close();
          if (typeof row?.version !== "string" || row.version.trim().length === 0) {
            throw new Error("sqlite-vec did not return vec_version()");
          }
          console.log("node-pty load: ok");
          console.log("sqlite-vec load: " + row.version);
          NODE
          RUNTIME_ROOT="$runtime_package" node --input-type=module <<'NODE'
          import fs from "node:fs";
          import path from "node:path";
          import { buildControlUiManifest } from "./scripts/verify-control-ui-release-parity.mjs";
          const expected = JSON.parse(fs.readFileSync(path.join(process.env.BUNDLE_DIR, "control-ui-runtime.manifest.json"), "utf8"));
          const actual = buildControlUiManifest(path.join(process.env.RUNTIME_ROOT, "dist/control-ui"));
          if (JSON.stringify(actual) !== JSON.stringify(expected)) {
            throw new Error("installed ARM64 runtime Control UI differs from the verified raw package");
          }
          fs.writeFileSync(
            path.join(process.env.BUNDLE_DIR, "control-ui-runtime-arm64.manifest.json"),
            JSON.stringify(actual, null, 2) + "\n",
          );
          const expectedBuild = {
            version: process.env.APP_VERSION,
            commit: process.env.SOURCE_SHA,
            builtAt: process.env.OPENCLAW_BUILD_TIMESTAMP,
          };
          const packageJson = JSON.parse(fs.readFileSync(path.join(process.env.RUNTIME_ROOT, "package.json"), "utf8"));
          if (packageJson.version !== expectedBuild.version) throw new Error("installed runtime package version mismatch");
          const buildInfo = JSON.parse(fs.readFileSync(path.join(process.env.RUNTIME_ROOT, "dist/build-info.json"), "utf8"));
          for (const [key, value] of Object.entries(expectedBuild)) {
            if (buildInfo[key] !== value) {
              throw new Error("installed runtime build-info " + key + "=" + buildInfo[key] + ", expected " + value);
            }
          }
          NODE

      - name: Validate Codex plugin convergence in default and node-host state roots
        run: |
          set -euo pipefail
          runtime_package="$RUNNER_TEMP/openclaw-runtime-final-check/package"
          codex_package="$BUNDLE_DIR/$CODEX_PACKAGE_NAME"
          convergence_root="$RUNNER_TEMP/openclaw-codex-convergence"
          shared_npm_cache="$RUNNER_TEMP/openclaw-codex-npm-cache"
          test -s "$runtime_package/openclaw.mjs"
          test -s "$codex_package"
          if [[ -e "$convergence_root" ]]; then
            echo "::error::Codex convergence root unexpectedly already exists."
            exit 1
          fi
          mkdir -p "$convergence_root/home" "$shared_npm_cache"

          validate_state_root() {
            local label="$1"
            local state_dir="$2"
            local doctor_receipt="$BUNDLE_DIR/codex-doctor-$label.json"
            local convergence_receipt="$BUNDLE_DIR/codex-convergence-$label.json"
            mkdir -p "$state_dir"
            env -u NODE_PATH \
              HOME="$convergence_root/home" \
              OPENCLAW_STATE_DIR="$state_dir" \
              NPM_CONFIG_CACHE="$shared_npm_cache" \
              node "$runtime_package/openclaw.mjs" \
                plugins install "npm-pack:$codex_package" --force
            doctor_status=0
            env -u NODE_PATH \
              HOME="$convergence_root/home" \
              OPENCLAW_STATE_DIR="$state_dir" \
              node "$runtime_package/openclaw.mjs" doctor --lint \
                --only core/doctor/configured-plugin-installs \
                --only core/doctor/plugin-registry \
                --json > "$doctor_receipt" || doctor_status=$?
            cat "$doctor_receipt"
            if (( doctor_status != 0 )); then
              echo "::error::Codex $label state doctor lint failed with status $doctor_status."
              exit "$doctor_status"
            fi
            codex_manifest="$(
              find "$state_dir" -type f \
                -path '*/node_modules/@openclaw/codex/package.json' \
                -print -quit
            )"
            if [[ -z "$codex_manifest" ]]; then
              echo "::error::Codex package was not installed in the $label state root."
              exit 1
            fi
            VALIDATION_LABEL="$label" \
            RUNTIME_ROOT="$runtime_package" \
            CODEX_ARCHIVE="$codex_package" \
            CODEX_MANIFEST="$codex_manifest" \
            DOCTOR_RECEIPT="$doctor_receipt" \
            CONVERGENCE_RECEIPT="$convergence_receipt" \
              node --input-type=module <<'NODE'
          import crypto from "node:crypto";
          import fs from "node:fs";
          import { createRequire } from "node:module";
          import path from "node:path";

          const digest = (file) =>
            crypto.createHash("sha256").update(fs.readFileSync(file)).digest("hex");
          const runtimeRoot = fs.realpathSync(process.env.RUNTIME_ROOT);
          const codexManifestPath = fs.realpathSync(process.env.CODEX_MANIFEST);
          const codexRoot = path.dirname(codexManifestPath);
          const codexManifest = JSON.parse(fs.readFileSync(codexManifestPath, "utf8"));
          const runtimeManifestPath = path.join(runtimeRoot, "package.json");
          const runtimeManifest = JSON.parse(fs.readFileSync(runtimeManifestPath, "utf8"));
          const buildInfoPath = path.join(runtimeRoot, "dist/build-info.json");
          const buildInfo = JSON.parse(fs.readFileSync(buildInfoPath, "utf8"));
          const doctor = JSON.parse(fs.readFileSync(process.env.DOCTOR_RECEIPT, "utf8"));
          if (doctor.ok !== true || !Array.isArray(doctor.findings) || doctor.findings.length !== 0) {
            throw new Error("Codex doctor receipt is not clean");
          }
          if (codexManifest.name !== "@openclaw/codex") throw new Error("installed Codex name mismatch");
          if (codexManifest.version !== process.env.APP_VERSION) throw new Error("installed Codex version mismatch");
          if (codexManifest.openclaw?.build?.openclawVersion !== process.env.APP_VERSION) {
            throw new Error("installed Codex build host mismatch");
          }
          const peerTarget = fs.realpathSync(path.join(codexRoot, "node_modules/openclaw"));
          if (peerTarget !== runtimeRoot) {
            throw new Error("Codex peer target does not point at the packaged runtime");
          }
          const codexRequire = createRequire(codexManifestPath);
          const sdkEntry = fs.realpathSync(codexRequire.resolve("openclaw/plugin-sdk/core"));
          const sdkRelative = path.relative(runtimeRoot, sdkEntry);
          if (sdkRelative.startsWith(".." + path.sep) || path.isAbsolute(sdkRelative)) {
            throw new Error("Codex plugin SDK resolved outside the packaged runtime");
          }
          if (runtimeManifest.version !== process.env.APP_VERSION) throw new Error("peer host version mismatch");
          if (buildInfo.commit !== process.env.SOURCE_SHA) throw new Error("peer host source mismatch");
          const receipt = {
            schemaVersion: 1,
            stateRoot: process.env.VALIDATION_LABEL,
            sourceSha: process.env.SOURCE_SHA,
            distributionName: process.env.APP_DISPLAY_NAME,
            version: process.env.APP_VERSION,
            unofficialSelfBuild: true,
            codex: {
              version: codexManifest.version,
              archiveSha256: digest(process.env.CODEX_ARCHIVE),
              packageJsonSha256: digest(codexManifestPath),
            },
            peerTarget: {
              identity: "packaged-runtime",
              version: runtimeManifest.version,
              sourceSha: buildInfo.commit,
              packageJsonSha256: digest(runtimeManifestPath),
              buildInfoSha256: digest(buildInfoPath),
              containedPluginSdk: true,
            },
            doctor: {
              checksRun: doctor.checksRun,
              findings: doctor.findings.length,
              ok: doctor.ok,
            },
          };
          fs.writeFileSync(
            process.env.CONVERGENCE_RECEIPT,
            JSON.stringify(receipt, null, 2) + "\n",
          );
          NODE
          }

          validate_state_root default "$convergence_root/home/.openclaw"
          validate_state_root node-host "$convergence_root/home/.openclaw-cli-state"
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import path from "node:path";
          const lines = [
            "# Codex plugin convergence",
            "",
            `${process.env.APP_DISPLAY_NAME} carries @openclaw/codex ${process.env.APP_VERSION} from source ${process.env.SOURCE_SHA}.`,
            "This is an unofficial self-build based on the official main development snapshot plus local modifications, not an official OpenClaw Beta.",
            "It has not been installed on a user machine.",
            "",
            "After the old Gateway is stopped and the matching App/Core runtime is installed, run the",
            "following separately for the default CLI state and the isolated node-host state:",
            "",
            "```sh",
            `OPENCLAW_STATE_DIR="<state-root>" node "<runtime>/openclaw.mjs" plugins install "npm-pack:<artifact>/${process.env.CODEX_PACKAGE_NAME}" --force`,
            'OPENCLAW_STATE_DIR="<state-root>" node "<runtime>/openclaw.mjs" doctor --lint --only core/doctor/configured-plugin-installs --only core/doctor/plugin-registry --json',
            "```",
            "",
            "Do not point both identities at one state root. The artifact validation receipts prove both",
            "isolated roots resolve their plugin-local OpenClaw peer to the matching packaged runtime.",
            "",
          ];
          fs.writeFileSync(
            path.join(process.env.BUNDLE_DIR, "CODEX-PLUGIN-CONVERGENCE.md"),
            lines.join("\n"),
          );
          NODE

      - name: Write final provenance and SHA256SUMS
        env:
          RUNTIME_NAME: ${{ steps.arm_runtime.outputs.runtime_name }}
          RAW_NPM_SHA256: ${{ steps.arm_runtime.outputs.raw_sha }}
          RUNTIME_NPM_VERSION: ${{ steps.arm_runtime.outputs.npm_version }}
        run: |
          set -euo pipefail
          if [[ -e "$FINAL_DIR" ]]; then
            echo "::error::Final output directory unexpectedly already exists."
            exit 1
          fi
          mkdir -p "$FINAL_DIR"
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import path from "node:path";
          for (const name of fs.readdirSync(process.env.BUNDLE_DIR).toSorted()) {
            const source = path.join(process.env.BUNDLE_DIR, name);
            if (!fs.statSync(source).isFile()) continue;
            if (name === process.env.RAW_PACKAGE_NAME || name === "INTEL-STAGING-SHA256SUMS") continue;
            fs.copyFileSync(source, path.join(process.env.FINAL_DIR, name));
          }
          fs.copyFileSync(
            path.join(process.env.BUNDLE_DIR, "INTEL-STAGING-SHA256SUMS"),
            path.join(process.env.FINAL_DIR, "intel-staging-components.sha256-receipt"),
          );
          NODE
          node --input-type=module <<'NODE'
          import crypto from "node:crypto";
          import fs from "node:fs";
          import path from "node:path";
          const finalDir = process.env.FINAL_DIR;
          const digest = (file) => crypto.createHash("sha256").update(fs.readFileSync(file)).digest("hex");
          const intelReceipt = JSON.parse(fs.readFileSync(path.join(finalDir, "intel-build-receipt.json"), "utf8"));
          const defaultCodex = JSON.parse(
            fs.readFileSync(path.join(finalDir, "codex-convergence-default.json"), "utf8"),
          );
          const nodeHostCodex = JSON.parse(
            fs.readFileSync(path.join(finalDir, "codex-convergence-node-host.json"), "utf8"),
          );
          const artifactFiles = fs
            .readdirSync(finalDir)
            .filter((name) => fs.statSync(path.join(finalDir, name)).isFile())
            .toSorted();
          const files = Object.fromEntries(artifactFiles.map((name) => {
            const file = path.join(finalDir, name);
            return [name, { bytes: fs.statSync(file).size, sha256: digest(file) }];
          }));
          const appZip = `OpenClaw-${process.env.APP_VERSION}.zip`;
          const appDmg = `OpenClaw-${process.env.APP_VERSION}.dmg`;
          for (const requiredFile of [appZip, appDmg, process.env.RUNTIME_NAME, process.env.CODEX_PACKAGE_NAME]) {
            if (!files[requiredFile]?.sha256) {
              throw new Error(`required component is absent from final artifact: ${requiredFile}`);
            }
          }
          if (
            defaultCodex.version !== process.env.APP_VERSION ||
            nodeHostCodex.version !== process.env.APP_VERSION ||
            defaultCodex.distributionName !== process.env.APP_DISPLAY_NAME ||
            nodeHostCodex.distributionName !== process.env.APP_DISPLAY_NAME ||
            defaultCodex.unofficialSelfBuild !== true ||
            nodeHostCodex.unofficialSelfBuild !== true ||
            defaultCodex.codex.version !== process.env.APP_VERSION ||
            nodeHostCodex.codex.version !== process.env.APP_VERSION ||
            defaultCodex.codex.archiveSha256 !== nodeHostCodex.codex.archiveSha256
          ) {
            throw new Error("default and node-host Codex convergence receipts disagree");
          }
          if (
            defaultCodex.peerTarget.version !== process.env.APP_VERSION ||
            nodeHostCodex.peerTarget.version !== process.env.APP_VERSION ||
            defaultCodex.peerTarget.sourceSha !== process.env.SOURCE_SHA ||
            nodeHostCodex.peerTarget.sourceSha !== process.env.SOURCE_SHA
          ) {
            throw new Error("Codex peer targets do not match the frozen Core");
          }
          const provenance = {
            schemaVersion: 4,
            product: "OpenClaw",
            distributionName: process.env.APP_DISPLAY_NAME,
            version: process.env.APP_VERSION,
            appBuild: process.env.APP_BUILD,
            identity: {
              machineVersion: process.env.APP_VERSION,
              humanName: process.env.APP_DISPLAY_NAME,
              unofficialSelfBuild: true,
              officialRelease: false,
              officialBeta: false,
              basis: "official-main-2026.8.1-development-snapshot-plus-local-modifications",
              appleVersionMapping: {
                CFBundleShortVersionString: process.env.APP_BUNDLE_SHORT_VERSION,
                CFBundleVersion: process.env.APP_BUILD,
                productVersionKey: "OpenClawProductVersion",
                productVersion: process.env.APP_VERSION,
              },
            },
            source: {
              repository: process.env.GITHUB_REPOSITORY,
              branch: "agent/openclaw-beta-5-1",
              sha: process.env.SOURCE_SHA,
              frozenOfficialSha: process.env.FROZEN_UPSTREAM_SHA,
              frozenOfficialBeta7Sha: process.env.FROZEN_BETA7_SHA,
              officialBetaVersion: process.env.OFFICIAL_BETA_VERSION,
              baseDescription: "official main 2026.8.1 development snapshot",
              localModifications: true,
            },
            build: {
              builtAt: process.env.OPENCLAW_BUILD_TIMESTAMP,
              workflowRunId: process.env.GITHUB_RUN_ID,
              workflowRunAttempt: process.env.GITHUB_RUN_ATTEMPT,
              workflowUrl: process.env.GITHUB_SERVER_URL + "/" + process.env.GITHUB_REPOSITORY + "/actions/runs/" + process.env.GITHUB_RUN_ID,
              appAssembly: { runner: "macos-26-intel", runnerArch: "X64", xcode: intelReceipt.xcode },
              runtimeAssembly: {
                runner: "macos-26",
                runnerArch: process.env.RUNNER_ARCH,
                node: process.version,
                npm: process.env.RUNTIME_NPM_VERSION,
              },
            },
            app: {
              bundleId: process.env.BUNDLE_ID,
              bundleShortVersion: process.env.APP_BUNDLE_SHORT_VERSION,
              bundleVersion: process.env.APP_BUILD,
              productVersion: process.env.APP_VERSION,
              distributionName: process.env.APP_DISPLAY_NAME,
              architectures: ["arm64", "x86_64"],
              signature: "ad-hoc",
              notarized: false,
            },
            runtime: {
              archive: process.env.RUNTIME_NAME,
              platform: "darwin",
              architecture: "arm64",
              sameSourceSha: true,
              rawPackageBuiltFromAppCheckout: true,
              rawNpmArchive: process.env.RAW_PACKAGE_NAME,
              rawNpmSha256: process.env.RAW_NPM_SHA256,
              installedFromRawNpmArchive: true,
              dependencyClosureValidated: true,
              dependencyPathsContained: true,
              doctorValidated: true,
              nodePtyLoaded: true,
              sqliteVecLoaded: true,
              controlUiParityValidated: true,
            },
            components: {
              app: {
                version: process.env.APP_VERSION,
                sourceSha: process.env.SOURCE_SHA,
                executableSha256: intelReceipt.appExecutableSha256,
                zip: appZip,
                zipSha256: files[appZip]?.sha256,
                dmg: appDmg,
                dmgSha256: files[appDmg]?.sha256,
              },
              core: {
                version: process.env.APP_VERSION,
                sourceSha: process.env.SOURCE_SHA,
                archive: process.env.RUNTIME_NAME,
                archiveSha256: files[process.env.RUNTIME_NAME]?.sha256,
              },
              codexPlugin: {
                version: defaultCodex.codex.version,
                sourceSha: process.env.SOURCE_SHA,
                archive: process.env.CODEX_PACKAGE_NAME,
                archiveSha256: files[process.env.CODEX_PACKAGE_NAME]?.sha256,
              },
              peerTargets: {
                default: defaultCodex.peerTarget,
                nodeHost: nodeHostCodex.peerTarget,
              },
            },
            pluginConvergence: {
              stateRoots: ["default", "node-host"],
              isolatedStatePreserved: true,
              doctorChecks: [
                "core/doctor/configured-plugin-installs",
                "core/doctor/plugin-registry",
              ],
              clean: defaultCodex.doctor.ok === true && nodeHostCodex.doctor.ok === true,
            },
            files,
          };
          fs.writeFileSync(path.join(finalDir, "provenance.json"), JSON.stringify(provenance, null, 2) + "\n");
          NODE
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import path from "node:path";
          const oldIdentity = "2026.8.1-beta.1";
          const textExtensions = new Set([".json", ".md", ".txt"]);
          for (const name of fs.readdirSync(process.env.FINAL_DIR)) {
            if (!textExtensions.has(path.extname(name))) continue;
            const contents = fs.readFileSync(path.join(process.env.FINAL_DIR, name), "utf8");
            if (contents.includes(oldIdentity)) {
              throw new Error(`stale product identity ${oldIdentity} remains in ${name}`);
            }
          }
          NODE
          node --input-type=module <<'NODE'
          import crypto from "node:crypto";
          import fs from "node:fs";
          import path from "node:path";
          const finalDir = process.env.FINAL_DIR;
          const lines = fs
            .readdirSync(finalDir)
            .filter((name) => name !== "SHA256SUMS")
            .filter((name) => fs.statSync(path.join(finalDir, name)).isFile())
            .toSorted()
            .map((name) => crypto.createHash("sha256").update(fs.readFileSync(path.join(finalDir, name))).digest("hex") + "  " + name);
          fs.writeFileSync(path.join(finalDir, "SHA256SUMS"), lines.join("\n") + "\n");
          NODE
          (cd "$FINAL_DIR" && shasum -a 256 -c SHA256SUMS)
          test -s "$FINAL_DIR/OpenClaw-$APP_VERSION.zip"
          test -s "$FINAL_DIR/OpenClaw-$APP_VERSION.dmg"
          test -s "$FINAL_DIR/$RUNTIME_NAME"
          test -s "$FINAL_DIR/$CODEX_PACKAGE_NAME"
          test -s "$FINAL_DIR/codex-convergence-default.json"
          test -s "$FINAL_DIR/codex-convergence-node-host.json"
          test -s "$FINAL_DIR/CODEX-PLUGIN-CONVERGENCE.md"
          test -s "$FINAL_DIR/provenance.json"
          test -s "$FINAL_DIR/SHA256SUMS"
          cat "$FINAL_DIR/provenance.json"
          cat "$FINAL_DIR/SHA256SUMS"
          {
            echo "## Complete macOS package ready"
            echo
            echo "- Artifact: $FINAL_ARTIFACT_NAME"
            echo "- Distribution: $APP_DISPLAY_NAME"
            echo "- Machine version: $APP_VERSION"
            echo "- Apple mapping: CFBundleShortVersionString=$APP_BUNDLE_SHORT_VERSION, CFBundleVersion=$APP_BUILD"
            echo "- Status: unofficial self-build from the frozen official main development snapshot plus local modifications; not an official Beta"
            echo "- Source: $SOURCE_SHA"
            echo "- App: universal arm64 + x86_64"
            echo "- Runtime: installed and validated darwin-arm64 dependency closure"
            echo "- Codex: matching plugin archive validated in isolated default and node-host states"
            echo "- Signing: ad-hoc; not notarized"
            echo "- Includes App ZIP, DMG, runnable runtime TGZ, Codex plugin TGZ, provenance and validation receipts"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload complete macOS package
        id: upload_final
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.FINAL_ARTIFACT_NAME }}
          path: ${{ env.FINAL_DIR }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
