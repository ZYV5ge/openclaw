name: OpenClaw beta.5.1 cloud build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beta51-cloud-build-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.15.0"
  BETA51_APP_VERSION: "2026.7.2-beta.5.1"
  BETA51_APP_BUILD: "2607000205"
  BETA51_BUNDLE_ID: ai.openclaw.mac
  BETA51_RELEASE_REPOSITORY: ZYV5ge/openclaw

jobs:
  verify_and_test:
    name: Verify latest official main and focused tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Require a public repository
        env:
          CURRENT_REPOSITORY: ${{ github.repository }}
          REPOSITORY_IS_PRIVATE: ${{ github.event.repository.private }}
        run: |
          set -euo pipefail
          if [[ "$CURRENT_REPOSITORY" != "$BETA51_RELEASE_REPOSITORY" ]]; then
            echo "::error::This personal build workflow may run only in $BETA51_RELEASE_REPOSITORY."
            exit 1
          fi
          if [[ "$REPOSITORY_IS_PRIVATE" != "false" ]]; then
            echo "::error::This workflow is restricted to public repositories so it cannot consume paid private-repository Actions minutes."
            exit 1
          fi

      - name: Checkout dispatched source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify source contains latest official main
        run: |
          set -euo pipefail
          official_remote="official-openclaw"
          official_url="https://github.com/openclaw/openclaw.git"
          if git remote get-url "$official_remote" >/dev/null 2>&1; then
            git remote set-url "$official_remote" "$official_url"
          else
            git remote add "$official_remote" "$official_url"
          fi
          git fetch --no-tags --prune "$official_remote" \
            "+refs/heads/main:refs/remotes/$official_remote/main"
          source_sha="$(git rev-parse HEAD)"
          upstream_sha="$(git rev-parse "refs/remotes/$official_remote/main")"
          if [[ ! "$source_sha" =~ ^[0-9a-f]{40}$ || ! "$upstream_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Source and upstream refs must resolve to full Git commit SHAs."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$upstream_sha" "$source_sha"; then
            echo "::error::Dispatched source $source_sha does not contain latest official main $upstream_sha. Rebase or merge locally, review, then dispatch again."
            exit 1
          fi
          echo "Verified source $source_sha contains official main $upstream_sha."

      - name: Setup Node and pnpm without Actions caches
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          install-bun: "false"
          use-actions-cache: "false"
          save-actions-cache: "false"

      - name: Check focused TypeScript formatting
        run: |
          set -euo pipefail
          node_modules/.bin/oxfmt --check \
            extensions/memory-core/src/memory-tool-manager.test-mocks.ts \
            extensions/memory-core/src/tools.citations.test.ts \
            extensions/memory-core/src/tools.shared.ts \
            extensions/memory-core/src/tools.test.ts \
            extensions/memory-core/src/tools.ts \
            extensions/memory-wiki/src/bounded-walk.test.ts \
            extensions/memory-wiki/src/bounded-walk.ts \
            extensions/memory-wiki/src/corpus-supplement.test.ts \
            extensions/memory-wiki/src/corpus-supplement.ts \
            extensions/memory-wiki/src/query.test.ts \
            extensions/memory-wiki/src/query.ts \
            src/gateway/session-utils-list.ts \
            src/gateway/session-utils.test.ts \
            src/plugins/memory-state.ts

      - name: Run focused memory tests
        env:
          OPENCLAW_VITEST_MAX_WORKERS: "2"
        run: |
          set -euo pipefail
          node scripts/run-vitest.mjs run \
            --config test/vitest/vitest.extension-memory.config.ts \
            memory-core/src/tools.citations.test.ts \
            memory-core/src/tools.test.ts \
            memory-wiki/src/bounded-walk.test.ts \
            memory-wiki/src/corpus-supplement.test.ts \
            memory-wiki/src/query.test.ts

      - name: Run focused gateway session tests
        env:
          OPENCLAW_GATEWAY_PROJECT_SHARDS: "0"
          OPENCLAW_VITEST_MAX_WORKERS: "2"
        run: |
          set -euo pipefail
          node scripts/run-vitest.mjs run \
            --config test/vitest/vitest.gateway.config.ts \
            session-utils.test.ts

      - name: Check workflow metadata
        run: node scripts/check-workflows.mjs

  build_macos:
    name: Build and publish universal ad-hoc signed macOS app
    needs: verify_and_test
    permissions:
      contents: write # Job-level scope is required to publish this run's verified prerelease assets.
    runs-on: macos-26-intel
    timeout-minutes: 180
    steps:
      - name: Require a public repository
        env:
          CURRENT_REPOSITORY: ${{ github.repository }}
          REPOSITORY_IS_PRIVATE: ${{ github.event.repository.private }}
        run: |
          set -euo pipefail
          if [[ "$CURRENT_REPOSITORY" != "$BETA51_RELEASE_REPOSITORY" ]]; then
            echo "::error::This personal build workflow may run only in $BETA51_RELEASE_REPOSITORY."
            exit 1
          fi
          if [[ "$REPOSITORY_IS_PRIVATE" != "false" ]]; then
            echo "::error::This workflow is restricted to public repositories so it cannot consume paid private-repository Actions minutes."
            exit 1
          fi

      - name: Checkout dispatched source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select an Xcode 26 toolchain
        run: |
          set -euo pipefail
          shopt -s nullglob
          xcode_candidates=(/Applications/Xcode_26*.app /Applications/Xcode-26*.app)
          if [[ "${#xcode_candidates[@]}" -eq 0 ]]; then
            echo "::error::The standard macos-26-intel runner does not expose Xcode 26."
            exit 1
          fi
          selected_xcode="${xcode_candidates[${#xcode_candidates[@]} - 1]}"
          sudo xcode-select -s "$selected_xcode/Contents/Developer"
          xcodebuild -version
          swift --version
          source scripts/lib/swift-toolchain.sh
          require_swift_toolchain

      - name: Verify source contains latest official main
        run: |
          set -euo pipefail
          official_remote="official-openclaw"
          official_url="https://github.com/openclaw/openclaw.git"
          if git remote get-url "$official_remote" >/dev/null 2>&1; then
            git remote set-url "$official_remote" "$official_url"
          else
            git remote add "$official_remote" "$official_url"
          fi
          git fetch --no-tags --prune "$official_remote" \
            "+refs/heads/main:refs/remotes/$official_remote/main"
          source_sha="$(git rev-parse HEAD)"
          upstream_sha="$(git rev-parse "refs/remotes/$official_remote/main")"
          if [[ ! "$source_sha" =~ ^[0-9a-f]{40}$ || ! "$upstream_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Source and upstream refs must resolve to full Git commit SHAs."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$upstream_sha" "$source_sha"; then
            echo "::error::Dispatched source $source_sha does not contain latest official main $upstream_sha. No automatic merge will be attempted."
            exit 1
          fi
          echo "Verified source $source_sha contains official main $upstream_sha."

      - name: Setup Node and pnpm without Actions caches
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          install-bun: "false"
          use-actions-cache: "false"
          save-actions-cache: "false"

      - name: Install pinned Swift formatters
        run: |
          set -euo pipefail
          swift_tools_dir="$RUNNER_TEMP/openclaw-beta51-swift-tools"
          scripts/install-swift-tools.sh "$swift_tools_dir"
          echo "$swift_tools_dir" >> "$GITHUB_PATH"

      - name: Check focused Swift formatting and lint
        run: |
          set -euo pipefail
          scripts/check-swift-tools.sh
          swiftformat --lint \
            apps/macos/Sources/OpenClaw/DashboardWindowController.swift \
            apps/macos/Sources/OpenClaw/WebChatSwiftUI.swift \
            apps/macos/Tests/OpenClawIPCTests/DashboardWindowSmokeTests.swift \
            apps/macos/Tests/OpenClawIPCTests/WebChatSwiftUISmokeTests.swift \
            --config config/swiftformat
          swiftformat --lint \
            apps/shared/OpenClawKit/Sources/OpenClawChatUI/ChatSessions.swift \
            apps/shared/OpenClawKit/Tests/OpenClawKitTests/ChatSessionSidebarModelTests.swift \
            --config config/swiftformat \
            --unexclude "$PWD/apps/shared/OpenClawKit/Sources/OpenClawChatUI,$PWD/apps/shared/OpenClawKit/Tests/OpenClawKitTests"
          scripts/lint-swift.sh macos

      - name: Run focused OpenClawKit tests
        run: |
          set -euo pipefail
          swift test \
            --package-path apps/shared/OpenClawKit \
            --filter ChatSessionSidebarModelTests \
            --no-parallel

      - name: Run focused macOS app tests
        run: |
          set -euo pipefail
          swift test \
            --package-path apps/macos \
            --filter 'DashboardWindowSmokeTests|WebChatSwiftUISmokeTests' \
            --no-parallel

      - name: Revalidate latest official main immediately before packaging
        id: package_source_guard
        run: |
          set -euo pipefail
          official_remote="official-openclaw"
          git fetch --no-tags --prune "$official_remote" \
            "+refs/heads/main:refs/remotes/$official_remote/main"
          source_sha="$(git rev-parse HEAD)"
          upstream_sha="$(git rev-parse "refs/remotes/$official_remote/main")"
          if [[ ! "$source_sha" =~ ^[0-9a-f]{40}$ || ! "$upstream_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Source and upstream refs must resolve to full Git commit SHAs."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$upstream_sha" "$source_sha"; then
            echo "::error::Official main advanced to $upstream_sha after validation. Update and review the branch; this workflow will not merge it automatically."
            exit 1
          fi
          if [[ -n "$(git status --porcelain=v1 --untracked-files=all)" ]]; then
            echo "::error::Release packaging requires a clean checkout."
            git status --short
            exit 1
          fi
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"

      - name: Package OpenClaw beta.5.1
        env:
          ALLOW_ADHOC_SIGNING: "1"
          APP_BUILD: ${{ env.BETA51_APP_BUILD }}
          APP_VERSION: ${{ env.BETA51_APP_VERSION }}
          BUNDLE_ID: ${{ env.BETA51_BUNDLE_ID }}
          BUILD_ARCHS: all
          BUILD_CONFIG: release
          CODESIGN_TIMESTAMP: off
          GIT_COMMIT: ${{ steps.package_source_guard.outputs.source_sha }}
          OPENCLAW_CONTROL_UI_RELEASE_BUILD: "1"
          SIGN_IDENTITY: "-"
          SKIP_PNPM_INSTALL: "1"
        run: scripts/package-mac-app.sh

      - name: Verify bundle identity, architecture, signature, and privacy boundary
        env:
          EXPECTED_SOURCE_SHA: ${{ steps.package_source_guard.outputs.source_sha }}
        run: |
          set -euo pipefail
          app="dist/OpenClaw.app"
          info_plist="$app/Contents/Info.plist"
          executable="$app/Contents/MacOS/OpenClaw"
          helper="$app/Contents/MacOS/openclaw-mlx-tts"
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$info_plist")" == "$BETA51_BUNDLE_ID" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$info_plist")" == "$BETA51_APP_VERSION" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$info_plist")" == "$BETA51_APP_BUILD" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :OpenClawGitCommit' "$info_plist")" == "$EXPECTED_SOURCE_SHA" ]]
          for binary in "$executable" "$helper"; do
            binary_archs="$(lipo -archs "$binary")"
            [[ " $binary_archs " == *" arm64 "* ]]
            [[ " $binary_archs " == *" x86_64 "* ]]
          done
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign_details="$(codesign -dv --verbose=4 "$app" 2>&1)"
          grep -q '^Signature=adhoc$' <<< "$codesign_details"
          if find "$app" -name .openclaw -print -quit | grep -q .; then
            echo "::error::User-state path unexpectedly found inside the app bundle."
            exit 1
          fi

      - name: Create app archive and provenance
        id: package_artifacts
        env:
          SOURCE_SHA: ${{ steps.package_source_guard.outputs.source_sha }}
          UPSTREAM_MAIN_SHA: ${{ steps.package_source_guard.outputs.upstream_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_RUN_ID" =~ ^[0-9]+$ || ! "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]; then
            echo "::error::GitHub run identity must be numeric."
            exit 1
          fi
          source_short="${SOURCE_SHA:0:12}"
          release_suffix="${source_short}-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          release_tag="beta51-build-${release_suffix}"
          archive="dist/OpenClaw-${BETA51_APP_VERSION}-${release_suffix}-macos-universal.zip"
          provenance="dist/OpenClaw-${BETA51_APP_VERSION}-${release_suffix}-provenance.json"
          ditto -c -k --sequesterRsrc --keepParent dist/OpenClaw.app "$archive"
          unzip -t "$archive"
          archive_listing="$(unzip -Z1 "$archive")"
          if grep -Eq '(^|/)\.openclaw(/|$)' <<< "$archive_listing"; then
            echo "::error::User-state path unexpectedly found inside the app archive."
            exit 1
          fi
          archive_bytes="$(stat -f %z "$archive")"
          if (( archive_bytes > 1900 * 1024 * 1024 )); then
            echo "::error::Archive is larger than 1900 MiB, too close to the GitHub Release per-file limit."
            exit 1
          fi
          export BETA51_ARCHIVE="$archive"
          export BETA51_PROVENANCE="$provenance"
          export BETA51_RELEASE_TAG="$release_tag"
          python3 - <<'PY'
          from __future__ import annotations

          import datetime as dt
          import hashlib
          import json
          import os
          import pathlib
          import plistlib
          import subprocess


          def output(*command: str, stderr: bool = False) -> str:
              result = subprocess.run(command, check=True, capture_output=True, text=True)
              value = result.stderr if stderr else result.stdout
              return value.strip()


          def sha256(path: pathlib.Path) -> str:
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()


          app = pathlib.Path("dist/OpenClaw.app")
          archive = pathlib.Path(os.environ["BETA51_ARCHIVE"])
          provenance = pathlib.Path(os.environ["BETA51_PROVENANCE"])
          executable = app / "Contents/MacOS/OpenClaw"
          helper = app / "Contents/MacOS/openclaw-mlx-tts"
          with (app / "Contents/Info.plist").open("rb") as handle:
              info = plistlib.load(handle)

          payload = {
              "schemaVersion": 1,
              "createdAtUtc": dt.datetime.now(dt.timezone.utc).isoformat(),
              "source": {
                  "repository": os.environ["GITHUB_REPOSITORY"],
                  "commit": os.environ["SOURCE_SHA"],
                  "officialUpstreamRepository": "openclaw/openclaw",
                  "officialUpstreamMainCommit": os.environ["UPSTREAM_MAIN_SHA"],
                  "containsOfficialUpstreamMain": True,
                  "customChangesFromOfficialMain": output(
                      "git",
                      "diff",
                      "--name-only",
                      f"{os.environ['UPSTREAM_MAIN_SHA']}..{os.environ['SOURCE_SHA']}",
                  ).splitlines(),
                  "reviewedUpstreamProposals": [
                      "https://github.com/openclaw/openclaw/pull/114183",
                      "https://github.com/openclaw/openclaw/pull/114193",
                      "https://github.com/openclaw/openclaw/pull/105161",
                      "https://github.com/openclaw/openclaw/pull/92632",
                      "https://github.com/openclaw/openclaw/pull/92833",
                  ],
                  "proposalPolicy": (
                      "Ideas were selectively adapted and independently tested; unmerged pull "
                      "request commits were not represented as official merged code."
                  ),
              },
              "application": {
                  "bundleIdentifier": info["CFBundleIdentifier"],
                  "version": info["CFBundleShortVersionString"],
                  "build": info["CFBundleVersion"],
                  "embeddedGitCommit": info["OpenClawGitCommit"],
                  "embeddedBuildTimestamp": info["OpenClawBuildTimestamp"],
                  "executableArchitectures": output("lipo", "-archs", str(executable)).split(),
                  "helperArchitectures": output("lipo", "-archs", str(helper)).split(),
                  "signing": {
                      "kind": "adhoc",
                      "details": output("codesign", "-dv", "--verbose=4", str(app), stderr=True),
                      "designatedRequirement": output("codesign", "-d", "-r-", str(app), stderr=True),
                  },
                  "mainExecutableSha256": sha256(executable),
              },
              "buildEnvironment": {
                  "workflowRunId": os.environ["GITHUB_RUN_ID"],
                  "workflowRunAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
                  "runnerOs": os.environ["RUNNER_OS"],
                  "runnerArch": os.environ["RUNNER_ARCH"],
                  "runnerImage": os.environ.get("ImageOS", "unknown"),
                  "runnerImageVersion": os.environ.get("ImageVersion", "unknown"),
                  "xcode": output("xcodebuild", "-version"),
                  "swift": output("swift", "--version"),
                  "node": output("node", "--version"),
                  "pnpm": output("pnpm", "--version"),
              },
              "artifact": {
                  "file": archive.name,
                  "bytes": archive.stat().st_size,
                  "sha256": sha256(archive),
                  "storage": "github-release-asset",
                  "releaseTag": os.environ["BETA51_RELEASE_TAG"],
              },
              "privacy": {
                  "includedUserState": False,
                  "includedOpenClawHome": False,
              },
          }
          provenance.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n")
          PY
          cat "$provenance"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "provenance=$provenance" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Publish unique GitHub prerelease assets
        env:
          ARCHIVE_PATH: ${{ steps.package_artifacts.outputs.archive }}
          GH_TOKEN: ${{ github.token }}
          PROVENANCE_PATH: ${{ steps.package_artifacts.outputs.provenance }}
          RELEASE_TAG: ${{ steps.package_artifacts.outputs.release_tag }}
          SOURCE_SHA: ${{ steps.package_source_guard.outputs.source_sha }}
          UPSTREAM_MAIN_SHA: ${{ steps.package_source_guard.outputs.upstream_sha }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$BETA51_RELEASE_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Refusing to overwrite existing release $RELEASE_TAG."
            exit 1
          fi
          if gh api "repos/$BETA51_RELEASE_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Refusing to reuse existing tag $RELEASE_TAG."
            exit 1
          fi
          archive_sha="$(shasum -a 256 "$ARCHIVE_PATH" | awk '{print $1}')"
          provenance_sha="$(shasum -a 256 "$PROVENANCE_PATH" | awk '{print $1}')"
          notes_file="$RUNNER_TEMP/openclaw-beta51-release-notes.md"
          {
            echo "Personal OpenClaw ${BETA51_APP_VERSION} prerelease built from reviewed source."
            echo
            echo "- Source commit: \`${SOURCE_SHA}\`"
            echo "- Official \`openclaw/openclaw@main\` included at build time: \`${UPSTREAM_MAIN_SHA}\`"
            echo "- Custom files relative to that official main and reviewed PR references: recorded in provenance JSON"
            echo "- Bundle ID: \`${BETA51_BUNDLE_ID}\`"
            echo "- Bundle version: \`${BETA51_APP_BUILD}\`"
            echo "- Architectures: \`arm64\`, \`x86_64\`"
            echo "- App archive SHA-256: \`${archive_sha}\`"
            echo "- User state / \`.openclaw\` data included: no"
            echo
            echo "This intermediate app is ad-hoc signed, is not Developer ID signed, and is not notarized."
            echo "Gatekeeper may block a downloaded copy until the user explicitly chooses Open Anyway in Privacy & Security."
            echo "Do not treat this archive as the final TCC/privacy-permission-stable installation; apply a stable local signing identity first."
            echo "The attached provenance JSON records the exact source, upstream main, toolchain, signing details, architectures, and hashes."
          } > "$notes_file"
          gh release create "$RELEASE_TAG" \
            "$ARCHIVE_PATH" \
            "$PROVENANCE_PATH" \
            --repo "$BETA51_RELEASE_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title "OpenClaw ${BETA51_APP_VERSION} (${SOURCE_SHA:0:12})" \
            --notes-file "$notes_file" \
            --draft \
            --prerelease

          expected_url="https://github.com/$BETA51_RELEASE_REPOSITORY/releases/tag/$RELEASE_TAG"
          archive_name="${ARCHIVE_PATH##*/}"
          provenance_name="${PROVENANCE_PATH##*/}"
          archive_bytes="$(stat -f %z "$ARCHIVE_PATH")"
          provenance_bytes="$(stat -f %z "$PROVENANCE_PATH")"
          draft_verified=false
          for attempt in {1..10}; do
            draft_json="$(gh release view "$RELEASE_TAG" \
              --repo "$BETA51_RELEASE_REPOSITORY" \
              --json tagName,targetCommitish,isDraft,isPrerelease,assets)"
            if DRAFT_RELEASE_JSON="$draft_json" \
              EXPECTED_ARCHIVE_DIGEST="sha256:$archive_sha" \
              EXPECTED_ARCHIVE_NAME="$archive_name" \
              EXPECTED_ARCHIVE_SIZE="$archive_bytes" \
              EXPECTED_PROVENANCE_DIGEST="sha256:$provenance_sha" \
              EXPECTED_PROVENANCE_NAME="$provenance_name" \
              EXPECTED_PROVENANCE_SIZE="$provenance_bytes" \
              EXPECTED_RELEASE_TAG="$RELEASE_TAG" \
              EXPECTED_SOURCE_SHA="$SOURCE_SHA" \
              python3 - <<'PY'
          import json
          import os
          import sys


          release = json.loads(os.environ["DRAFT_RELEASE_JSON"])
          expected_assets = {
              os.environ["EXPECTED_ARCHIVE_NAME"]: {
                  "digest": os.environ["EXPECTED_ARCHIVE_DIGEST"],
                  "size": int(os.environ["EXPECTED_ARCHIVE_SIZE"]),
              },
              os.environ["EXPECTED_PROVENANCE_NAME"]: {
                  "digest": os.environ["EXPECTED_PROVENANCE_DIGEST"],
                  "size": int(os.environ["EXPECTED_PROVENANCE_SIZE"]),
              },
          }
          assets = {asset["name"]: asset for asset in release.get("assets", [])}
          valid = (
              release.get("tagName") == os.environ["EXPECTED_RELEASE_TAG"]
              and release.get("targetCommitish") == os.environ["EXPECTED_SOURCE_SHA"]
              and release.get("isDraft") is True
              and release.get("isPrerelease") is True
              and set(assets) == set(expected_assets)
              and all(
                  assets[name].get("state") == "uploaded"
                  and assets[name].get("size") == expected["size"]
                  and assets[name].get("digest") == expected["digest"]
                  for name, expected in expected_assets.items()
              )
          )
          raise SystemExit(0 if valid else 1)
          PY
            then
              draft_verified=true
              break
            fi
            if [[ "$attempt" -lt 10 ]]; then
              sleep 3
            fi
          done
          if [[ "$draft_verified" != "true" ]]; then
            echo "::error::Draft release metadata or uploaded assets failed verification; leaving the release private as a draft."
            exit 1
          fi

          # Write the summary before the only operation that makes the draft public.
          {
            echo "## OpenClaw ${BETA51_APP_VERSION}"
            echo
            echo "- Bundle ID: \`${BETA51_BUNDLE_ID}\`"
            echo "- Build: \`${BETA51_APP_BUILD}\`"
            echo "- Source: \`${SOURCE_SHA}\`"
            echo "- Official main included: \`${UPSTREAM_MAIN_SHA}\`"
            echo "- Runner: standard \`macos-26-intel\`"
            echo "- Prerelease tag: \`${RELEASE_TAG}\`"
            echo "- Release: ${expected_url}"
            echo
            echo "> Intermediate only: ad-hoc signed, not Developer ID signed, and not notarized. Gatekeeper may require an explicit Open Anyway action. Apply a stable local signing identity before final installation or TCC validation."
          } >> "$GITHUB_STEP_SUMMARY"
          gh release edit "$RELEASE_TAG" \
            --repo "$BETA51_RELEASE_REPOSITORY" \
            --draft=false >/dev/null
