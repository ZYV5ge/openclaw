name: OpenClaw 2026.8.1 Self-Built Beta 1 cloud build

on:
  push:
    branches:
      - agent/openclaw-beta-5-1
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character source SHA to validate
        required: true
        type: string
      suite:
        description: Fixed validation suite
        required: true
        default: gemini-schema
        type: choice
        options:
          - gemini-schema
          - personal-preflight
          - personal-sqlite
          - personal-updater
          - personal-telegram
          - personal-restart-handoff
          - personal-terminal-recovery-residue
          - personal-session-search
          - personal-mac-ui
          - personal-control-ui-send
          - personal-gateway-hot-path
          - personal-memory-wiki-search
          - personal-postcutoff-inference
          - personal-postcutoff-gateway-lifecycle
          - personal-postcutoff-media-policy
          - personal-postcutoff-file-mutations
          - personal-postcutoff-service-ca
          - personal-i18n
          - personal-macos-package
      phase:
        description: TDD evidence phase; does not alter the test command
        required: true
        default: red
        type: choice
        options:
          - red
          - green

permissions:
  contents: read

run-name: OpenClaw 2026.8.1 Self-Built Beta 1 ${{ inputs.suite || (contains(github.event.head_commit.message, '[package]') && 'personal-macos-package' || 'personal-preflight') }} ${{ inputs.phase || ((contains(github.event.head_commit.message, '[green]') || contains(github.event.head_commit.message, '[package]')) && 'green' || 'red') }} ${{ inputs.source_sha || github.sha }}

concurrency:
  group: personal-2026-8-1-selfbuild-1-${{ inputs.source_sha || github.sha }}-${{ inputs.suite || (contains(github.event.head_commit.message, '[package]') && 'personal-macos-package' || 'personal-preflight') }}-${{ inputs.phase || ((contains(github.event.head_commit.message, '[green]') || contains(github.event.head_commit.message, '[package]')) && 'green' || 'red') }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.15.0"
  PERSONAL_VERSION: "2026.8.1-selfbuild.1"
  PERSONAL_DISPLAY_NAME: "OpenClaw 2026.8.1 Self-Built Beta 1"
  PERSONAL_APP_BUNDLE_SHORT_VERSION: "2026.8.1"
  PERSONAL_APP_BUILD: "2608000189"
  OFFICIAL_BETA_VERSION: "2026.7.2-beta.7"
  FROZEN_UPSTREAM_SHA: "f9eae0c2762dbd646afc6cbc41a34354af3ef1ac"
  FROZEN_BETA7_SHA: "dabe1915362e20c25704af91612a32a8f4c96e83"
  PERSONAL_RELEASE_REPOSITORY: "ZYV5ge/openclaw"

jobs:
  focused_validation:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.suite != 'personal-mac-ui') }}
    name: ${{ inputs.suite || 'personal-preflight' }} (${{ inputs.phase || ((contains(github.event.head_commit.message, '[green]') || contains(github.event.head_commit.message, '[package]')) && 'green' || 'red') }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Validate immutable public-repository dispatch
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          EVENT_SHA: ${{ github.sha }}
          CURRENT_REPOSITORY: ${{ github.repository }}
          REPOSITORY_IS_PRIVATE: ${{ github.event.repository.private }}
          CURRENT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$CURRENT_REPOSITORY" != "$PERSONAL_RELEASE_REPOSITORY" ]]; then
            echo "::error::This workflow is restricted to $PERSONAL_RELEASE_REPOSITORY."
            exit 1
          fi
          if [[ "$REPOSITORY_IS_PRIVATE" != "false" ]]; then
            echo "::error::The personal build must use a public repository and standard free runners."
            exit 1
          fi
          if [[ "$CURRENT_REF" != "refs/heads/agent/openclaw-beta-5-1" ]]; then
            echo "::error::Dispatch the one existing personal repair branch."
            exit 1
          fi
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::source_sha must be a full lowercase Git SHA."
            exit 1
          fi
          if [[ "$EVENT_SHA" != "$SOURCE_SHA" ]]; then
            echo "::error::The dispatched ref resolved to $EVENT_SHA, expected $SOURCE_SHA."
            exit 1
          fi

      - name: Checkout exact source SHA
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 200
          persist-credentials: false

      - name: Verify frozen official ancestry
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "$SOURCE_SHA" ]]; then
            echo "::error::Checkout did not resolve to the requested source SHA."
            exit 1
          fi
          official_remote="official-openclaw"
          official_url="https://github.com/openclaw/openclaw.git"
          git remote add "$official_remote" "$official_url"
          git fetch --no-tags --filter=blob:none "$official_remote" \
            "$FROZEN_UPSTREAM_SHA" "$FROZEN_BETA7_SHA"
          if ! git merge-base --is-ancestor "$FROZEN_UPSTREAM_SHA" "$SOURCE_SHA"; then
            echo "::error::Source does not contain frozen official main $FROZEN_UPSTREAM_SHA."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$FROZEN_BETA7_SHA" "$SOURCE_SHA"; then
            echo "::error::Source does not contain official beta.7 $FROZEN_BETA7_SHA."
            exit 1
          fi
          echo "Validated $PERSONAL_VERSION from frozen official main $FROZEN_UPSTREAM_SHA and beta.7 $FROZEN_BETA7_SHA."

      - name: Setup pinned Node and pnpm without Actions caches
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          install-bun: "false"
          use-actions-cache: "false"
          save-actions-cache: "false"

      - name: Check workflow and focused formatting
        env:
          TDD_PHASE: ${{ inputs.phase || ((contains(github.event.head_commit.message, '[green]') || contains(github.event.head_commit.message, '[package]')) && 'green' || 'red') }}
