              src/infra/startup-migration-checkpoint.test.ts \
              src/commands/doctor-session-sqlite-compact.ts \
              src/commands/doctor-session-sqlite-migration-run.ts \
              src/commands/doctor-session-sqlite-types.ts \
              src/commands/doctor-session-sqlite.test.ts \
              src/commands/doctor-session-sqlite.ts \
              src/commands/doctor-sqlite-compact.ts \
              src/commands/doctor-state-sqlite-compact.test.ts \
              src/commands/doctor-state-sqlite-compact.ts \
              src/state/openclaw-state-db-startup-checkpoint.ts \
              src/state/openclaw-state-db.ts \
              ui/src/lib/chat/outbox-store-codec.ts \
              ui/src/pages/chat/chat-outbox-drain.ts \
              ui/src/pages/chat/chat-send-actions.ts \
              ui/src/pages/chat/chat-send-delivery.ts \
              ui/src/pages/chat/composer-persistence.ts \
