      - name: Run fixed focused suite
        env:
          SUITE: ${{ inputs.suite == 'personal-macos-package' && 'personal-preflight' || (inputs.suite || 'personal-preflight') }}
          TDD_PHASE: ${{ inputs.phase || ((contains(github.event.head_commit.message, '[green]') || contains(github.event.head_commit.message, '[package]')) && 'green' || 'red') }}
