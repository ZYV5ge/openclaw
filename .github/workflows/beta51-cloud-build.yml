name: OpenClaw 2026.7.2-beta.6.1 cloud validation

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character source SHA to validate
        required: true
        type: string
      suite:
        description: Fixed validation suite
        required: true
        default: gemini-schema
        type: choice
        options:
          - gemini-schema
          - beta6-sqlite
          - beta6-updater
          - beta6-telegram
          - beta6-restart-handoff
          - beta6-terminal-recovery-residue
          - beta6-session-search
          - beta6-mac-ui
          - beta6-control-ui-send
          - beta6-memory-wiki-search
      phase:
        description: TDD evidence phase; does not alter the test command
        required: true
        default: red
        type: choice
        options:
          - red
          - green

permissions:
  contents: read

run-name: OpenClaw 2026.7.2-beta.6.1 ${{ inputs.suite }} ${{ inputs.phase }} ${{ inputs.source_sha }}

concurrency:
  group: personal-beta-6-1-${{ inputs.source_sha }}-${{ inputs.suite }}-${{ inputs.phase }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.15.0"
  PERSONAL_VERSION: "2026.7.2-beta.6.1"
  UPSTREAM_VERSION: "2026.7.2-beta.6"
  FROZEN_UPSTREAM_SHA: "2fcb1f728028085197f322dfcd61ea7dba174102"
  PERSONAL_RELEASE_REPOSITORY: "ZYV5ge/openclaw"

jobs:
  focused_validation:
    if: ${{ inputs.suite != 'beta6-mac-ui' }}
    name: ${{ inputs.suite }} (${{ inputs.phase }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Validate immutable public-repository dispatch
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          EVENT_SHA: ${{ github.sha }}
          CURRENT_REPOSITORY: ${{ github.repository }}
          REPOSITORY_IS_PRIVATE: ${{ github.event.repository.private }}
          CURRENT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$CURRENT_REPOSITORY" != "$PERSONAL_RELEASE_REPOSITORY" ]]; then
            echo "::error::This workflow is restricted to $PERSONAL_RELEASE_REPOSITORY."
            exit 1
          fi
          if [[ "$REPOSITORY_IS_PRIVATE" != "false" ]]; then
            echo "::error::The personal build must use a public repository and standard free runners."
            exit 1
          fi
          if [[ "$CURRENT_REF" != "refs/heads/agent/openclaw-beta-5-1" ]]; then
            echo "::error::Dispatch the one existing personal repair branch."
            exit 1
          fi
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::source_sha must be a full lowercase Git SHA."
            exit 1
          fi
          if [[ "$EVENT_SHA" != "$SOURCE_SHA" ]]; then
            echo "::error::The dispatched ref resolved to $EVENT_SHA, expected $SOURCE_SHA."
            exit 1
          fi

      - name: Checkout exact source SHA
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 200
          persist-credentials: false

      - name: Verify frozen official ancestry
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "$SOURCE_SHA" ]]; then
            echo "::error::Checkout did not resolve to the requested source SHA."
            exit 1
          fi
          official_remote="official-openclaw"
          official_url="https://github.com/openclaw/openclaw.git"
          git remote add "$official_remote" "$official_url"
          git fetch --no-tags --filter=blob:none "$official_remote" "$FROZEN_UPSTREAM_SHA"
          if ! git merge-base --is-ancestor "$FROZEN_UPSTREAM_SHA" "$SOURCE_SHA"; then
            echo "::error::Source does not contain frozen official main $FROZEN_UPSTREAM_SHA."
            exit 1
          fi
          echo "Validated $PERSONAL_VERSION from frozen official main $FROZEN_UPSTREAM_SHA."

      - name: Setup pinned Node and pnpm without Actions caches
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          install-bun: "false"
          use-actions-cache: "false"
          save-actions-cache: "false"

      - name: Check workflow and focused formatting
        env:
          TDD_PHASE: ${{ inputs.phase }}
        run: |
          set -euo pipefail
          node scripts/check-workflows.mjs
          if [[ "$TDD_PHASE" == "red" ]]; then
            node_modules/.bin/oxfmt \
              extensions/memory-core/src/tools.shared.ts \
              extensions/memory-core/src/tools.ts \
              extensions/memory-core/src/tools.shared.test.ts \
              extensions/memory-core/src/tools.citations.test.ts \
              extensions/memory-wiki/src/bounded-walk.abort.test.ts \
              extensions/memory-wiki/src/corpus-supplement.test.ts \
              extensions/memory-wiki/src/compile.ts \
              extensions/memory-wiki/src/compile.test.ts \
              extensions/memory-wiki/src/compiled-cache.integration.test.ts \
              extensions/memory-wiki/src/query.test.ts \
              extensions/memory-wiki/src/tool.test.ts \
              extensions/google/web-search-provider.test.ts \
              packages/gateway-protocol/src/schema/logs-chat.test.ts \
              src/config/sessions/session-accessor.sqlite-active-events.test.ts \
              src/gateway/server-methods/chat.directive-tags.test.ts \
              ui/src/lib/chat/outbox-store.test.ts \
              ui/src/pages/chat/chat-submit-guard.test.ts \
              ui/src/pages/chat/chat-send.test.ts
            git --no-pager diff -- \
              extensions/memory-core/src/tools.shared.ts \
              extensions/memory-core/src/tools.ts \
              extensions/memory-core/src/tools.shared.test.ts \
              extensions/memory-core/src/tools.citations.test.ts \
              extensions/memory-wiki/src/bounded-walk.abort.test.ts \
              extensions/memory-wiki/src/corpus-supplement.test.ts \
              extensions/memory-wiki/src/compile.ts \
              extensions/memory-wiki/src/compile.test.ts \
              extensions/memory-wiki/src/compiled-cache.integration.test.ts \
              extensions/memory-wiki/src/query.test.ts \
              extensions/memory-wiki/src/tool.test.ts \
              extensions/google/web-search-provider.test.ts \
              packages/gateway-protocol/src/schema/logs-chat.test.ts \
              src/config/sessions/session-accessor.sqlite-active-events.test.ts \
              src/gateway/server-methods/chat.directive-tags.test.ts \
              ui/src/lib/chat/outbox-store.test.ts \
              ui/src/pages/chat/chat-submit-guard.test.ts \
              ui/src/pages/chat/chat-send.test.ts
          fi
          node_modules/.bin/oxfmt --check \
            extensions/memory-core/src/tools.shared.ts \
            extensions/memory-core/src/tools.ts \
            extensions/memory-core/src/tools.shared.test.ts \
            extensions/memory-core/src/tools.test.ts \
            extensions/memory-core/src/tools.citations.test.ts \
            extensions/memory-core/src/memory/search-deadline.test.ts \
            extensions/memory-wiki/src/bounded-walk.abort.test.ts \
            extensions/memory-wiki/src/corpus-supplement.test.ts \
            extensions/memory-wiki/src/compile.ts \
            extensions/memory-wiki/src/compile.test.ts \
            extensions/memory-wiki/src/compiled-cache.integration.test.ts \
            extensions/memory-wiki/src/query.test.ts \
            extensions/memory-wiki/src/tool.test.ts \
            extensions/memory-wiki/src/bounded-walk.ts \
            extensions/memory-wiki/src/corpus-supplement.ts \
            extensions/memory-wiki/src/log.ts \
            extensions/memory-wiki/src/query.ts \
            extensions/memory-wiki/src/tool.ts \
            extensions/memory-wiki/src/vault.ts \
            src/plugins/registry-contribution-types.ts \
            extensions/google/src/gemini-web-search-provider.ts \
            extensions/google/web-search-provider.test.ts \
            src/state/openclaw-state-db-startup-checkpoint.ts \
            src/state/openclaw-state-db.test.ts \
            src/cli/update-cli/update-command-service.ts \
            src/cli/update-cli/update-command.test.ts \
            extensions/telegram/src/bot/body-helpers.ts \
            extensions/telegram/src/bot-message-context.body.ts \
            extensions/telegram/src/bot-message-context.body.test.ts \
            src/agents/session-write-lock-error.ts \
            src/agents/main-session-recovery-state.ts \
            src/agents/main-session-recovery-store.test.ts \
            src/agents/main-session-recovery-state.test.ts \
            src/agents/main-session-recovery-run-ownership.test.ts \
            src/auto-reply/reply/agent-runner-error-handler.ts \
            src/auto-reply/reply/agent-runner-execute.ts \
            src/auto-reply/reply/agent-runner-execution.types.ts \
            src/auto-reply/reply/agent-runner-run.ts \
            src/auto-reply/reply/restart-recovery-claim.ts \
            src/auto-reply/reply/agent-runner-execution-terminal-failures.test.ts \
            src/auto-reply/reply/restart-recovery-claim.test.ts \
            src/auto-reply/reply/agent-runner.runreplyagent.e2e.test.ts \
            src/gateway/session-utils.test.ts \
            packages/gateway-protocol/src/schema/logs-chat.ts \
            packages/gateway-protocol/src/schema/logs-chat.test.ts \
            src/config/sessions/session-accessor.sqlite-active-events.ts \
            src/config/sessions/session-accessor.sqlite-active-events.test.ts \
            src/config/sessions/session-accessor.sqlite-active-path.ts \
            src/config/sessions/session-accessor.ts \
            src/config/sessions/session-transcript-index.ts \
            src/gateway/server-methods/chat-send-admission.ts \
            src/gateway/server-methods/chat.directive-tags.test.ts \
            ui/src/lib/chat/chat-types.ts \
            ui/src/lib/chat/outbox-store-codec.ts \
            ui/src/lib/chat/outbox-store.test.ts \
            ui/src/pages/chat/chat-send-actions.ts \
            ui/src/pages/chat/chat-send-contract.ts \
            ui/src/pages/chat/chat-send-delivery.ts \
            ui/src/pages/chat/chat-send-queue-state.ts \
            ui/src/pages/chat/chat-send-request.ts \
            ui/src/pages/chat/chat-send-submit.ts \
            ui/src/pages/chat/chat-outbox-drain.ts \
            ui/src/pages/chat/chat-pane-render.ts \
            ui/src/pages/chat/chat-view.ts \
            ui/src/pages/chat/chat-submit-guard.ts \
            ui/src/pages/chat/chat-submit-guard.test.ts \
            ui/src/pages/chat/chat-send.test.ts \
            ui/src/pages/chat/chat-composer.test.ts \
            ui/src/pages/chat/steer-lifecycle.ts \
            ui/src/pages/chat/components/chat-composer.ts \
            ui/src/pages/chat/components/chat-composer-types.ts \
            ui/src/pages/chat/components/chat-composer-slash-menu.ts

      - name: Run fixed focused suite
        env:
          SUITE: ${{ inputs.suite }}
          OPENCLAW_VITEST_MAX_WORKERS: "2"
        run: |
          set -euo pipefail
          case "$SUITE" in
            gemini-schema)
              node scripts/run-vitest.mjs run                 --config test/vitest/vitest.extension-providers.config.ts                 google/web-search-provider.test.ts
              ;;
            beta6-sqlite)
              node scripts/run-vitest.mjs run --config test/vitest/vitest.unit-src.config.ts src/state/openclaw-state-db.test.ts
              ;;
            beta6-updater)
              node scripts/run-vitest.mjs run --config test/vitest/vitest.cli.config.ts src/cli/update-cli/update-command.test.ts
              ;;
            beta6-telegram)
              node scripts/run-vitest.mjs run --config test/vitest/vitest.extension-telegram.config.ts telegram/src/bot-message-context.body.test.ts
              ;;
            beta6-restart-handoff)
              unit_status=0
              node scripts/run-vitest.mjs run \
                --config test/vitest/vitest.auto-reply-reply.config.ts \
                src/auto-reply/reply/restart-recovery-claim.test.ts \
                src/auto-reply/reply/agent-runner-execution-terminal-failures.test.ts || unit_status=$?
              e2e_status=0
              OPENCLAW_E2E_WORKERS=1 node scripts/run-vitest.mjs run \
                --config test/vitest/vitest.e2e.config.ts \
                src/auto-reply/reply/agent-runner.runreplyagent.e2e.test.ts \
                -t "preserves an adopted restart claim when the replacement takes the SQLite lease" || e2e_status=$?
              if (( unit_status != 0 || e2e_status != 0 )); then
                echo "::error::restart handoff unit status=$unit_status e2e status=$e2e_status"
                exit 1
              fi
              ;;
            beta6-terminal-recovery-residue)
              node scripts/run-vitest.mjs run \
                --config test/vitest/vitest.agents-core.config.ts \
                src/agents/main-session-recovery-store.test.ts
              node scripts/run-vitest.mjs run \
                src/agents/main-session-recovery-state.test.ts
              node scripts/run-vitest.mjs run \
                src/agents/main-session-recovery-run-ownership.test.ts
              ;;
            beta6-session-search)
              node scripts/run-vitest.mjs run src/gateway/session-utils.test.ts
              ;;
            beta6-memory-wiki-search)
              memory_test_status=0
              node scripts/run-vitest.mjs run \
                --config test/vitest/vitest.extension-memory.config.ts \
                memory-core/src/tools.shared.test.ts \
                memory-core/src/tools.test.ts \
                memory-core/src/tools.citations.test.ts \
                memory-core/src/memory/search-deadline.test.ts \
                memory-wiki/src/bounded-walk.abort.test.ts \
                memory-wiki/src/corpus-supplement.test.ts \
                memory-wiki/src/compile.test.ts \
                memory-wiki/src/compiled-cache.integration.test.ts \
                memory-wiki/src/query.test.ts \
                memory-wiki/src/tool.test.ts || memory_test_status=$?
              core_type_status=0
              pnpm tsgo:core || core_type_status=$?
              extension_type_status=0
              pnpm tsgo:extensions || extension_type_status=$?
              extension_test_type_status=0
              pnpm tsgo:extensions:test || extension_test_type_status=$?
              if (( memory_test_status != 0 || core_type_status != 0 || extension_type_status != 0 || extension_test_type_status != 0 )); then
                echo "::error::memory test status=$memory_test_status core types=$core_type_status extension types=$extension_type_status extension test types=$extension_test_type_status"
                exit 1
              fi
              ;;
            beta6-control-ui-send)
              protocol_status=0
              node scripts/run-vitest.mjs run \
                --config test/vitest/vitest.gateway-client.config.ts \
                packages/gateway-protocol/src/schema/logs-chat.test.ts || protocol_status=$?
              accessor_status=0
              node scripts/run-vitest.mjs run \
                --config test/vitest/vitest.runtime-config.config.ts \
                src/config/sessions/session-accessor.sqlite-active-events.test.ts || accessor_status=$?
              gateway_status=0
              OPENCLAW_VITEST_MAX_WORKERS=1 node scripts/run-vitest.mjs run \
                --config test/vitest/vitest.gateway-methods.config.ts \
                src/gateway/server-methods/chat.directive-tags.test.ts || gateway_status=$?
              ui_status=0
              pnpm --dir ui exec vitest run --config vitest.config.ts \
                src/lib/chat/outbox-store.test.ts \
                src/pages/chat/chat-submit-guard.test.ts \
                src/pages/chat/chat-send.test.ts \
                src/pages/chat/chat-composer.test.ts || ui_status=$?
              core_type_status=0
              pnpm tsgo:core || core_type_status=$?
              src_test_type_status=0
              pnpm tsgo:test:src || src_test_type_status=$?
              package_test_type_status=0
              pnpm tsgo:test:packages || package_test_type_status=$?
              ui_type_status=0
              pnpm tsgo:ui || ui_type_status=$?
              ui_test_type_status=0
              pnpm tsgo:test:ui || ui_test_type_status=$?
              kysely_lint_status=0
              pnpm lint:kysely || kysely_lint_status=$?
              accessor_boundary_status=0
              pnpm lint:tmp:session-accessor-boundary || accessor_boundary_status=$?
              reader_boundary_status=0
              pnpm lint:tmp:session-transcript-reader-boundary || reader_boundary_status=$?
              sqlite_boundary_status=0
              pnpm lint:tmp:sqlite-transaction-boundary || sqlite_boundary_status=$?
              if (( protocol_status != 0 || accessor_status != 0 || gateway_status != 0 || ui_status != 0 || core_type_status != 0 || src_test_type_status != 0 || package_test_type_status != 0 || ui_type_status != 0 || ui_test_type_status != 0 || kysely_lint_status != 0 || accessor_boundary_status != 0 || reader_boundary_status != 0 || sqlite_boundary_status != 0 )); then
                echo "::error::active-path status protocol=$protocol_status accessor=$accessor_status gateway=$gateway_status ui=$ui_status core=$core_type_status src-test=$src_test_type_status package-test=$package_test_type_status ui-types=$ui_type_status ui-test-types=$ui_test_type_status kysely=$kysely_lint_status accessor-boundary=$accessor_boundary_status reader-boundary=$reader_boundary_status sqlite-boundary=$sqlite_boundary_status"
                exit 1
              fi
              ;;
            *)
              echo "::error::Unsupported fixed suite: $SUITE"
              exit 1
              ;;
          esac

  macos_ui_validation:
    if: ${{ inputs.suite == 'beta6-mac-ui' }}
    name: ${{ inputs.suite }} (${{ inputs.phase }})
    runs-on: macos-26-intel
    timeout-minutes: 90
    steps:
      - name: Validate immutable public-repository dispatch
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          EVENT_SHA: ${{ github.sha }}
          CURRENT_REPOSITORY: ${{ github.repository }}
          REPOSITORY_IS_PRIVATE: ${{ github.event.repository.private }}
          CURRENT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$CURRENT_REPOSITORY" != "$PERSONAL_RELEASE_REPOSITORY" ]]; then
            echo "::error::This workflow is restricted to $PERSONAL_RELEASE_REPOSITORY."
            exit 1
          fi
          if [[ "$REPOSITORY_IS_PRIVATE" != "false" ]]; then
            echo "::error::The personal build must use a public repository and standard free runners."
            exit 1
          fi
          if [[ "$CURRENT_REF" != "refs/heads/agent/openclaw-beta-5-1" ]]; then
            echo "::error::Dispatch the one existing personal repair branch."
            exit 1
          fi
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::source_sha must be a full lowercase Git SHA."
            exit 1
          fi
          if [[ "$EVENT_SHA" != "$SOURCE_SHA" ]]; then
            echo "::error::The dispatched ref resolved to $EVENT_SHA, expected $SOURCE_SHA."
            exit 1
          fi

      - name: Checkout exact source SHA
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 200
          persist-credentials: false

      - name: Verify frozen official ancestry and Xcode
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "$SOURCE_SHA" ]]; then
            echo "::error::Checkout did not resolve to the requested source SHA."
            exit 1
          fi
          official_remote="official-openclaw"
          official_url="https://github.com/openclaw/openclaw.git"
          git remote add "$official_remote" "$official_url"
          git fetch --no-tags --filter=blob:none "$official_remote" "$FROZEN_UPSTREAM_SHA"
          if ! git merge-base --is-ancestor "$FROZEN_UPSTREAM_SHA" "$SOURCE_SHA"; then
            echo "::error::Source does not contain frozen official main $FROZEN_UPSTREAM_SHA."
            exit 1
          fi
          xcodebuild -version
          xcode_version="$(xcodebuild -version | awk 'NR == 1 { print $2 }')"
          if [[ "$xcode_version" != 26.* ]]; then
            echo "::error::Expected Xcode 26.x, got $xcode_version."
            exit 1
          fi
          swift --version

      - name: Run macOS and shared UI regression suites
        run: |
          set -euo pipefail
          macos_status=0
          swift test             --package-path apps/macos             --filter 'DashboardWindowSmokeTests|WebChatSwiftUISmokeTests'             --no-parallel || macos_status=$?
          shared_status=0
          swift test             --package-path apps/shared/OpenClawKit             --filter 'ChatSessionSidebarModelTests|ChatViewModelSessionDeletionTests'             --no-parallel || shared_status=$?
          if (( macos_status != 0 || shared_status != 0 )); then
            echo "::error::macOS suite status=$macos_status shared UI suite status=$shared_status"
            exit 1
          fi
